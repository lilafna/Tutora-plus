return `<form data-f="kid" class="card" style="margin-bottom:14px"><h3>Ajouter un enfant</h3><div class="two"><label>Prénom<input name="prenom" required></label><label>Niveau<select name="niveau"><option>Primaire</option><option>Collège</option></select></label></div><label class="chk" style="display:flex;gap:8px;align-items:center;font-weight:500"><input type="checkbox" name="tel" value="1">Mon enfant a un téléphone</label><button class="btn sm amber">Ajouter</button></form>`+(ks.map(k=>`<div class="item"><div><b>${esc(k.prenom)}</b> · ${esc(k.niveau)} <span class="tag">${k.a_telephone?'Avec téléphone':'Sans téléphone'}</span></div>${k.a_telephone?`<div>${qr(base+k.token)}</div><small>Votre enfant scanne ce QR code avec son téléphone pour ouvrir son espace.</small><div class="acts"><button class="btn sm line" data-act="copy" data-link="${esc(base+k.token)}">Copier le lien</button></div>`:`<small>Il utilise votre téléphone pour voir ses devoirs et écrire à son répétiteur.</small><div class="acts"><a class="btn sm amber" data-go="eleve-${k.token}">Ouvrir son espace</a></div>`}</div>`).join('')||'<p class="empty">Aucun enfant ajouté. Ajoutez-en un pour faire une demande de répétiteur.</p>')}
let CT=null,CD=null;
async function childLoad(tok){CT=tok;try{const {data,error}=await SB.rpc('child_view',{tok});if(error||!data){$('#app').innerHTML='<section class="sec"><div class="wrap narrow"><h2>Lien invalide</h2><p class="lead">Demandez un nouveau QR code à votre parent.</p></div></section>';return}CD=data;childPage()}catch(e){toast('Connexion impossible')}}
function childPage(){const c=CD.child,ss=CD.sessions||[],done=ss.filter(s=>s.fiche),next=ss.filter(s=>s.st=='Prévue');
$('#app').innerHTML=`<section class="sec"><div class="wrap narrow"><h2>Salut ${esc(c.prenom)} !</h2><p class="lead">Ton espace : tes séances, tes devoirs et tes messages.</p>
<h3 style="margin-top:22px">Prochaines séances</h3>${next.map(s=>`<div class="item"><b>${esc(s.date)} à ${esc((s.heure||'').slice(0,5))}</b><small>Avec ${esc(s.rep)}</small></div>`).join('')||'<p class="empty">Aucune séance prévue.</p>'}
<h3 style="margin-top:22px">Devoirs et progrès</h3>${done.map(s=>`<div class="item"><b>${esc(s.date)}</b><div><b>Travaillé :</b> ${esc(s.fiche.notions)}<br><b>Devoirs :</b> ${esc(s.fiche.devoirs||'—')}<br><b>Niveau :</b> ${esc(s.fiche.niveau)}</div></div>`).join('')||'<p class="empty">Rien pour le moment.</p>'}
<h3 style="margin-top:22px">Messages avec ton répétiteur</h3><div class="note" style="margin:8px 0 12px">Tes parents peuvent lire ces messages.</div>${(CD.messages||[]).map(m=>`<div class="item" style="max-width:88%;${m.mine?'margin-left:auto;background:var(--wash)':''}"><small>${m.mine?'Toi':'Répétiteur'} · ${esc(new Date(m.t).toLocaleString('fr-FR'))}</small>${esc(m.txt)}</div>`).join('')||'<p class="empty">Aucun message.</p>'}
<form data-f="cmsg" style="margin-top:12px"><label>Ta question<textarea name="txt" required maxlength="1000"></textarea></label><button class="btn amber">Envoyer</button></form></div></section>`}
function entree(){const c=(go,n,t,d)=>`<a class="card" data-go="${go}" style="display:block;text-decoration:none;color:inherit;cursor:pointer"><div class="n">${n}</div><h3>${t}</h3><p>${d}</p></a>`;
return `<section class="sec"><div class="wrap"><h1 style="font-size:clamp(2rem,6vw,3.2rem)">Bienvenue sur Tutora +</h1><p class="lead">Pour commencer, dites-nous qui vous êtes.</p><div class="grid">${c('parent-connexion',1,'Je suis parent','Je me connecte ou je crée mon compte pour trouver un répétiteur.')}${c('rep-connexion',2,'Je suis répétiteur','Je me connecte ou je m’inscris avec ma carte d’étudiant.')}${c('observer',3,'Je visite le site','Je consulte simplement les informations publiques.')}</div><p style="margin-top:28px"><a data-go="admin-connexion" style="cursor:pointer;text-decoration:underline;color:var(--soft)">Accès administrateur</a></p></div></section>`}
function auth(role,mode){const sign=mode=='inscription'&&role!='admin',rep=role=='rep';
return `<section class="sec"><div class="wrap narrow"><a data-go="entree" style="cursor:pointer;color:var(--soft)">← Changer de profil</a><h2 style="margin-top:10px">${PORT[role]} : ${sign?'créer un compte':'se connecter'}</h2>
${role!='admin'?`<div class="tabs"><a class="btn sm line ${!sign?'on':''}" data-go="${role}-connexion">J’ai déjà un compte</a><a class="btn sm line ${sign?'on':''}" data-go="${role}-inscription">Créer un compte</a></div>`:'<p class="lead">Accès réservé à l’équipe Tutora +.</p>'}
<form data-f="${sign?'signup':'login'}" style="margin-top:16px"><input type="hidden" name="role" value="${role}">
${sign?`<label>Nom complet<input name="nom" required></label><label>Téléphone / WhatsApp<input name="tel" type="tel" required></label><label>Quartier<input name="quartier" required></label>`:''}
<label>Email<input name="email" type="email" required></label><label>Mot de passe<input name="pw" type="password" minlength="6" required></label>
${sign&&rep?`<label>Matières enseignées${chk('mat',allMat())}</label><label>Niveaux pris en charge${chk('niv',['Primaire','Collège'])}</label><label>Disponibilités<input name="dispo" placeholder="Ex. lun–ven après 17 h" required></label>
<h3>Votre carte d’étudiant</h3><label>Établissement<input name="ecole" required></label><div class="two"><label>Filière et année d’études<input name="filiere" required></label><label>N° de carte d’étudiant<input name="num" required></label></div><label>Photo ou scan de la carte<input type="file" name="fcarte" accept="image/*,.pdf" required></label>
<div class="note">Après votre inscription, votre profil sera mis en attente. L’équipe vérifiera votre carte puis vous donnera un rendez-vous.</div>`:''}
${sign?cons(role):''}<button class="btn amber">${sign?'Créer mon compte':'Me connecter'}</button></form></div></section>`}
function msgs(u){const ro=!!viewing();
if(u.role=='admin')return `<form data-f="msg" class="card" style="margin-bottom:14px"><label>Écrire à<select name="to" required><option value="">Choisir…</option>${D.u.filter(x=>x.role!='admin').map(x=>`<option value="${x.id}">${esc(x.nom)} (${x.role=='rep'?'répétiteur':'parent'})</option>`).join('')}</select></label><label>Message<textarea name="txt" required></textarea></label><button class="btn sm amber">Envoyer</button></form><h3>Tous les messages</h3><div style="margin-top:12px">${[...D.msg].reverse().map(m=>`<div class="item"><small>${esc(m.t)} · ${esc(m.from?U(m.from).nom:'Élève '+kname(m.ch))} → ${esc(m.ch&&!m.to?'Élève '+kname(m.ch):who(m.to))}</small>${esc(m.txt)}</div>`).join('')||'<p class="empty">Aucun message.</p>'}</div>`;
const par=u.role=='parent',ps=[...new Set(D.ses.filter(s=>par?s.pid==u.id:s.rid==u.id).map(s=>par?s.rid:s.pid))],
kd=par?D.children.filter(k=>k.pid==u.id).map(k=>({id:k.id,n:k.prenom})):[...new Map(D.req.filter(r=>r.rid==u.id&&r.child_id&&r.st!='Nouvelle').map(r=>[r.child_id,{id:r.child_id,n:r.enfant}])).values()],
cs=[0,...ps,...kd.map(k=>'k'+k.id)].map(String),c=tab.mc!=null&&cs.includes(String(tab.mc))?String(tab.mc):'0',isK=c[0]=='k',
nm=i=>i[0]=='k'?'Élève '+(kd.find(k=>'k'+k.id==i)?.n||''):who(i),
th=D.msg.filter(m=>isK?m.ch==c.slice(1):c=='0'?(!m.ch&&((m.from==u.id&&m.to==0)||(m.to==u.id&&!ps.includes(m.from)))):(!m.ch&&((m.from==u.id&&m.to==c)||(m.from==c&&m.to==u.id))));
return `<div class="tabs">${cs.map(i=>`<button class="btn sm line ${i==c?'on':''}" data-act="ct" data-id="${i}">${esc(nm(i))}</button>`).join('')}</div>${isK&&par?'<div class="note" style="margin:0 0 12px">Vous voyez tous les messages de votre enfant avec son répétiteur.</div>':''}${th.map(m=>`<div class="item" style="max-width:88%;${m.from==u.id?'margin-left:auto;background:var(--wash)':''}"><small>${esc(m.t)} · ${m.from==u.id?'Vous':m.from?esc(who(m.from)):'Élève'}</small>${esc(m.txt)}</div>`).join('')||'<p class="empty">Aucun message.</p>'}${ro||(isK&&par)?'':`<form data-f="msg" data-to="${c}" style="margin-top:14px"><label>Votre message<textarea name="txt" required></textarea></label><button class="btn sm amber">Envoyer</button></form>`}`}

function reqForm(){const u=cur();if(!u||u.role!='parent')return '<section class="sec"><div class="wrap narrow"><h2>Demander un répétiteur</h2><p class="lead">Cette page est réservée aux comptes parents.</p></div></section>';
const ks=D.children.filter(k=>k.pid==u.id);if(!ks.length)return `<section class="sec"><div class="wrap narrow"><h2>Demander un répétiteur</h2><p class="lead">Ajoutez d’abord votre enfant, pour qu’il ait son espace et ses devoirs.</p><button class="btn amber" data-act="goKids">Ajouter mon enfant</button></div></section>`;
return `<section class="sec"><div class="wrap narrow"><h2>Demander un répétiteur</h2><form data-f="req" style="margin-top:20px">
<label>Pour quel enfant ?<select name="child" required>${ks.map(k=>`<option value="${k.id}">${esc(k.prenom)} · ${esc(k.niveau)}</option>`).join('')}</select></label>
<label>Matières${chk('mat',allMat())}</label><label class="chk"><span style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="exam" value="1">Préparation au CEE ou au BEPC</span></label>
<div class="two"><label>Type de cours<select name="type"><option>Individuel</option><option>Groupe (4 à 6 élèves)</option></select></label><label>Quartier<input name="quartier" value="${esc(u.quartier)}" required></label></div>
<div class="two"><label>Budget mensuel (facultatif)<input name="budget" placeholder="Ex. 200 000 GNF"></label><label>Jours et heures disponibles<input name="dispo" required placeholder="Ex. mar. et jeu. après 17 h"></label></div>
<button class="btn amber">Envoyer ma demande</button></form></div></section>`}

const T=(role,list)=>{const t=list.some(x=>x[0]==tab[role])?tab[role]:list[0][0];return `<div class="tabs">${list.map(([k,l])=>`<button class="btn sm line ${k==t?'on':''}" data-act="tab" data-r="${role}" data-v="${k}">${l}</button>`).join('')}</div>`};
const sesLine=s=>`<b>${esc(s.date)} à ${esc((s.heure||'').slice(0,5))}</b> · ${esc(D.req.find(r=>r.id==s.qid)?.enfant)} ${st(s.st)}`;

function space(){const u=cur(),h=u.role=='parent'?parent(u):u.role=='rep'?tutor(u):admin();
return `<section class="sec"><div class="wrap">${viewing()?`<div class="note" style="margin:0 0 16px">Vous consultez l’espace de <b>${esc(u.nom)}</b> en tant qu’administrateur. <button class="btn sm line" data-act="unview">Retour à mon espace</button></div>`:''}<div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center"><div><h2>Bonjour ${esc(u.nom.split(' ')[0])}</h2><p class="lead" style="margin:4px 0 0">Espace ${{parent:'parent',rep:'répétiteur',admin:'administrateur'}[u.role]}</p></div><button class="btn line sm" data-act="logout">Se déconnecter</button></div>${h}</div></section>`}

function parent(u){const L=[['d','Mes demandes'],['p','Planning'],['k','Mes enfants'],['s','Suivi et avis'],['m','Messages']],t=tab.parent||'d',mine=D.req.filter(r=>r.pid==u.id),ses=D.ses.filter(s=>s.pid==u.id);let b='';
if(t=='d')b=`<a class="btn amber" data-go="demande">+ Nouvelle demande</a><div style="margin-top:16px">${mine.map(r=>`<div class="item"><b>${esc(r.enfant)} · ${esc(r.niveau)} · ${esc(r.type)}</b><div>${tags(r.mat)}${r.exam?'<span class="tag">CEE/BEPC</span>':''}</div><small>${esc(r.quartier)} · ${esc(r.dispo)}${r.budget?' · '+esc(r.budget):''}</small><div>${st(r.st)}</div></div>`).join('')||'<p class="empty">Aucune demande pour l’instant.</p>'}</div>`;
if(t=='p')b=ses.map(s=>{const rq=D.req.find(r=>r.id==s.qid);return `<div class="item">${sesLine(s)}<small>Répétiteur : ${esc(U(s.rid).nom)} · ${rq.st=='Affectée'?'en attente de son acceptation':'confirmée'}</small>${cancel(s)}</div>`}).join('')||'<p class="empty">Aucune séance prévue.</p>';
if(t=='s')b=bill(u)+ses.filter(s=>s.st=='Réalisée').map(s=>{const f=s.fiche,av=D.rep.find(x=>x.sid==s.id&&x.kind=='avis');return `<div class="item">${sesLine(s)}<div><b>Notions :</b> ${esc(f.notions)}<br><b>Niveau perçu :</b> ${esc(f.niveau)}<br><b>Devoirs :</b> ${esc(f.devoirs||'—')}<br><b>Remarques :</b> ${esc(f.obs||'—')}</div>
<div>${s.conf?st('Séance validée')+' '+st(s.pay):`<button class="btn sm amber" data-act="conf" data-id="${s.id}">Je confirme la présence du répétiteur</button>`}</div>
${av?`<div>Votre avis : ${'★'.repeat(av.note)}${'☆'.repeat(5-av.note)} ${esc(av.txt)}</div>`:`<form data-f="avis" data-id="${s.id}"><div class="two"><label>Note<select name="note"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></label><label>Commentaire<input name="txt"></label></div><button class="btn sm amber">Publier mon avis</button></form>`}
<details><summary>Signaler un problème</summary><form data-f="signal" data-id="${s.id}" style="margin-top:10px"><label>Absence, qualité, litige…<textarea name="txt" required></textarea></label><button class="btn sm red">Envoyer à l’équipe</button></form></details></div>`}).join('')||'<p class="empty">Les fiches de séance apparaîtront ici après chaque cours.</p>';
if(t=='k')b=kids(u);if(t=='m')b=msgs(u);return T('parent',L)+b}

function tutor(u){const ok=u.st=='valide',L=ok?[['pr','Mon profil'],['dm','Demandes'],['pl','Planning et fiches'],['hi','Historique'],['ms','Messages']]:[['pr','Mon profil'],['ms','Messages']],t=L.some(x=>x[0]==tab.rep)?tab.rep:'pr',ses=D.ses.filter(s=>s.rid==u.id);let b='';
if(t=='pr')b=`<div class="item"><div>${st(RL[u.st])}</div><div>${tags(u.mat)}${tags(u.niv)}</div><small>${esc(u.quartier)} · ${esc(u.dispo)} · ${esc(u.tel)}</small><small>Carte d’étudiant : ${esc(u.docs?.ecole)}, ${esc(u.docs?.filiere)}, N° ${esc(u.docs?.num)}</small></div>`+(u.rdv&&u.st!='valide'?`<div class="note"><b>Rendez-vous :</b> ${esc(u.rdv.date)} à ${esc(u.rdv.heure)} · ${esc(u.rdv.lieu)}</div>`:'')+(u.st=='attente'?'<div class="note">Votre inscription est bien reçue. L’équipe va vérifier votre carte d’étudiant puis vous donner un rendez-vous. Vous êtes en attente.</div>':u.st=='refuse'?'<div class="note">Votre profil n’a pas été retenu. Écrivez à l’équipe dans Messages.</div>':'');
if(t=='dm')b=D.req.filter(r=>r.rid==u.id&&r.st=='Affectée').map(r=>`<div class="item"><b>${esc(r.enfant)} · ${esc(r.niveau)} · ${esc(r.type)}</b><div>${tags(r.mat)}</div><small>${esc(r.quartier)} · ${esc(r.dispo)}</small><div class="acts"><button class="btn sm amber" data-act="acc" data-id="${r.id}">Accepter</button><button class="btn sm red" data-act="ref" data-id="${r.id}">Refuser</button></div></div>`).join('')||'<p class="empty">Aucune demande à traiter.</p>';
if(t=='pl')b=ses.filter(s=>s.st=='Prévue').map(s=>`<div class="item">${sesLine(s)}${cancel(s)}<details><summary>Remplir la fiche de séance</summary><form data-f="fiche" data-id="${s.id}" style="margin-top:10px"><label>Points étudiés<textarea name="notions" required></textarea></label><label>Niveau constaté<select name="niveau" required><option value="">Choisir…</option><option>Insuffisant</option><option>Moyen</option><option>Bien</option><option>Très bien</option></select></label><label>Devoirs à faire<input name="devoirs"></label><label>Remarques<input name="obs"></label><button class="btn sm amber">Enregistrer la fiche</button></form></details></div>`).join('')||'<p class="empty">Aucune séance à venir.</p>';
if(t=='hi')b=ses.filter(s=>s.st=='Réalisée').map(s=>{const a=D.rep.find(x=>x.sid==s.id&&x.kind=='avis');return `<div class="item">${sesLine(s)}<small>${a?'Avis : '+'★'.repeat(a.note)+' '+esc(a.txt):'Pas encore d’avis'}</small></div>`}).join('')||'<p class="empty">Aucune séance effectuée.</p>';
if(t=='ms')b=msgs(u);return T('rep',L)+b}

function admin(){const L=[['c','Comptes'],['q','Demandes'],['s','Séances'],['g','Signalements'],['m','Messages'],['x','Paramètres']],t=tab.admin||'c';let b='';
const reps=D.u.filter(x=>x.role=='rep'&&x.st=='valide');
if(t=='c')b=D.u.filter(x=>x.role!='admin').map(x=>`<div class="item"><b>${esc(x.nom)}</b> ${st(x.role=='rep'?RL[x.st]:'Parent')}<small>${esc(x.email)} · ${esc(x.tel)} · ${esc(x.quartier)}</small>${x.role=='rep'?`<div>${tags(x.mat)}${tags(x.niv)}</div><small>${esc(x.dispo)}</small><small>Carte d’étudiant : <a class="btn sm line" data-act="carte" data-path="${esc(x.docs?.carte)}">Voir la carte</a> · ${esc(x.docs?.ecole)} · ${esc(x.docs?.filiere)} · N° ${esc(x.docs?.num)}</small>${x.rdv?`<small>Rendez-vous : ${esc(x.rdv.date)} à ${esc(x.rdv.heure)} · ${esc(x.rdv.lieu)}</small>`:''}${x.st=='attente'||x.st=='rdv'?`<form data-f="rdv" data-id="${x.id}" class="two"><label>Date<input type="date" name="date" required></label><label>Heure<input type="time" name="heure" required></label><label>Lieu<input name="lieu" required></label><button class="btn sm line">${x.st=='rdv'?'Changer':'Fixer'} le rendez-vous</button></form><div class="acts">${x.st=='rdv'?`<button class="btn sm amber" data-act="val" data-id="${x.id}">Valider le profil</button>`:''}<button class="btn sm red" data-act="rej" data-id="${x.id}">Refuser</button></div>`:''}`:''}<div class="acts"><button class="btn sm line" data-act="view" data-id="${x.id}">Ouvrir son espace</button><button class="btn sm line" data-act="mkadm" data-id="${x.id}">Nommer administrateur</button></div></div>`).join('')||'<p class="empty">Aucun compte.</p>';
if(t=='q')b=D.req.map(r=>`<div class="item"><b>${esc(r.enfant)} · ${esc(r.niveau)} · ${esc(r.type)}</b> ${st(r.st)}<div>${tags(r.mat)}</div><small>Parent : ${esc(U(r.pid).nom)} · ${esc(r.quartier)} · ${esc(r.dispo)}${r.budget?' · '+esc(r.budget):''}</small>${wreq(r)}${r.st=='Nouvelle'||r.st.startsWith('Refus')?`<form data-f="assign" data-id="${r.id}" class="two"><label>Répétiteur<select name="rid" required><option value="">Choisir…</option>${reps.map(x=>`<option value="${x.id}">${esc(x.nom)} (${esc(x.quartier)})</option>`).join('')}</select></label><label>Date<input type="date" name="date" required></label><label>Heure<input type="time" name="heure" required></label><button class="btn sm amber">Affecter</button></form>`:`<small>Répétiteur : ${esc(U(r.rid).nom)}</small>`}</div>`).join('')||'<p class="empty">Aucune demande.</p>';
if(t=='s')b=D.ses.map(s=>`<div class="item">${sesLine(s)}<small>${esc(U(s.rid).nom)} · Parent : ${esc(U(s.pid).nom)} · Fiche : ${s.fiche?'remplie':'manquante'}</small>${wses(s)}<div>Paiement : ${st(s.pay)} ${s.pay=='Paiement déclaré'?`<button class="btn sm amber" data-act="payok" data-id="${s.id}">Preuve vérifiée</button>`:''}</div></div>`).join('')||'<p class="empty">Aucune séance.</p>';
if(t=='g')b=D.rep.filter(x=>x.kind=='signal').map(x=>`<div class="item"><b>Signalement</b> ${st(x.st)}<p>${esc(x.txt)}</p><small>Par ${esc(U(x.by).nom)} · séance ${x.sid}</small>${x.st=='Ouvert'?`<button class="btn sm amber" data-act="solve" data-id="${x.id}">Marquer traité</button>`:''}</div>`).join('')||'<p class="empty">Aucun signalement.</p>';
if(t=='x')b=`<form data-f="cfg" class="card"><div class="two"><label>Prix d’une séance individuelle (GNF)<input name="prix" type="number" value="${D.cfg.prix}" required></label><label>Séances par mois<input name="sc" type="number" value="${D.cfg.sc}" required></label></div><div class="two"><label>Tarif groupe par élève et par séance (GNF)<input name="grp" type="number" value="${D.cfg.grp}" required></label><label>Quartier pilote<input name="zone" value="${esc(D.cfg.zone)}"></label></div><div class="two"><label>Numéro WhatsApp (avec 224)<input name="wa" value="${esc(D.cfg.wa)}" required></label><label>Email de contact<input name="mail" type="email" value="${esc(D.cfg.mail)}" required></label></div><button class="btn amber">Enregistrer</button></form><div class="note">Pour ajouter un administrateur : la personne crée un compte Parent, puis cliquez sur « Nommer administrateur » dans Comptes.</div><div class="note">Les accès sont contrôlés par la base de données (Supabase).</div>`;
if(t=='m')b=msgs(me());return T('admin',L)+b}

function render(){const raw=(location.hash||'#entree').slice(1),a=me(),pub=['accueil','fonctionnement','tarifs','faq'],leg=['conditions','confidentialite'],isAuth=/^((parent|rep)-(connexion|inscription)|admin-connexion)$/.test(raw),isChild=/^eleve-[0-9a-f-]{36}$/i.test(raw);let r=raw;
if(r=='observer'){obs=true;try{sessionStorage.setItem('obs','1')}catch(e){}r='accueil'}
if(a){if(!(['espace','demande',...leg].includes(r)||isChild))r='espace'}else if(!(isAuth||isChild||leg.includes(r)||r=='entree'||(obs&&pub.includes(r))))r=obs?'accueil':'entree';
if(r!=raw){try{history.replaceState(null,'','#'+r)}catch(e){}}
$('#pub').hidden=!(obs&&!a);
$('#navr').innerHTML=a?`<a class="btn amber sm" data-go="espace">Mon espace</a>`:`<a class="btn amber sm" data-go="entree">Se connecter</a>`;
$('#ft').innerHTML=`Tutora + · Pilote à ${esc(D.cfg.zone)} · <a target="_blank" rel="noopener" href="${wa('Bonjour Tutora +')}">WhatsApp ${pn()}</a> · <a href="mailto:${esc(D.cfg.mail)}">${esc(D.cfg.mail)}</a> · <a data-go="conditions">Conditions</a> · <a data-go="confidentialite">Confidentialité</a>`;
const [p,m]=r.split('-'),v={espace:space,demande:reqForm,entree:entree,conditions:()=>legal(0),confidentialite:()=>legal(1)}[r]||(isAuth?()=>auth(p,m):null)||(isChild?()=>{childLoad(r.slice(6));return '<section class="sec"><div class="wrap"><p class="lead">Chargement…</p></div></section>'}:null);
$('#app').innerHTML=v?v():home();
if(['fonctionnement','tarifs','faq'].includes(r))setTimeout(()=>document.getElementById(r)?.scrollIntoView(),30);else scrollTo(0,0)}
const go=r=>{if(location.hash=='#'+r)render();else location.hash=r};
addEventListener('hashchange',render);
const ok=async p=>{const r=await p;if(r.error){toast('Erreur : '+r.error.message);r.error.shown=1;throw r.error}return r};
async function loadCfg(){try{const {data}=await SB.from('settings').select('*').eq('k','cfg');if(data&&data[0])D.cfg={...DEF,...data[0].v}}catch(e){}}
async function load(){if(!D.me)return;const g=t=>SB.from(t).select('*').order('id'),r=await Promise.all([SB.from('profiles').select('*'),g('requests'),g('sessions'),g('messages'),g('reports'),SB.from('children').select('*')]);
D.u=r[0].data||[];D.req=r[1].data||[];D.ses=r[2].data||[];D.rep=r[4].data||[];D.children=r[5].data||[];
D.msg=(r[3].data||[]).map(m=>({id:m.id,from:m.from_id,to:m.to_id||0,ch:m.child_id,txt:m.txt,t:new Date(m.created_at).toLocaleString('fr-FR')}));await loadCfg()}
const clear=()=>{D.me=null;D.view=null;D.u=[];D.req=[];D.ses=[];D.msg=[];D.rep=[];D.children=[];tab={}};
async function boot(){try{if(!SB)throw 0;await loadCfg();const {data}=await SB.auth.getSession();if(data.session){D.me=data.session.user.id;await load();if(!me()){await SB.auth.signOut();clear()}}}catch(e){toast('Connexion au serveur impossible')}render()}
setInterval(()=>{if(D.me&&!document.hidden&&location.hash=='#espace'&&!document.activeElement?.closest('form,input,textarea,select'))load().then(render).catch(()=>{})},30000);
document.addEventListener('click',async e=>{const g=e.target.closest('[data-go]');if(g){e.preventDefault();return go(g.dataset.go)}
const a=e.target.closest('[data-act]');if(!a)return;const id=a.dataset.id,A=a.dataset.act,S=D.ses.find(s=>s.id==id),q=(t,v)=>SB.from(t).update(v).eq('id',id);
try{
if(A=='inst'){if(ip)ip.prompt();return}
if(A=='tab')tab[a.dataset.r]=a.dataset.v;else if(A=='ct')tab.mc=id;else if(A=='view'){D.view=id;tab={}}else if(A=='unview'){D.view=null;tab={}}
else if(A=='logout'){await SB.auth.signOut();clear();obs=false;try{sessionStorage.removeItem('obs')}catch(e){}return go('entree')}
else if(A=='carte'){const {data}=await SB.storage.from('cartes').createSignedUrl(a.dataset.path,300);if(data)open(data.signedUrl,'_blank');else toast('Carte introuvable');return}
else if(A=='copy'){try{await navigator.clipboard.writeText(a.dataset.link);toast('Lien copié')}catch(e){toast('Copiez le lien manuellement')}return}else if(A=='goKids'){tab.parent='k';return go('espace')}else if(A=='acc'){await ok(q('requests',{st:'Acceptée'}));toast('Demande acceptée')}
else if(A=='ref'){await ok(q('requests',{st:'Refusée par le répétiteur'}));await ok(SB.from('sessions').update({st:'Annulée'}).eq('qid',id));toast('Demande refusée')}
else if(A=='val'){await ok(q('profiles',{st:'valide'}));toast('Profil validé')}else if(A=='rej'){await ok(q('profiles',{st:'refuse'}));toast('Profil refusé')}
else if(A=='mkadm'){if(confirm('Donner les droits administrateur à ce compte ?')){await ok(q('profiles',{role:'admin'}));toast('Administrateur ajouté')}}
else if(A=='paydecl'){const c=cur(),ids=D.ses.filter(s=>s.pid==c.id&&s.conf&&s.pay=='Non payé').map(s=>s.id);if(ids.length)await ok(SB.from('sessions').update({pay:'Paiement déclaré'}).in('id',ids));toast('Paiement déclaré, en attente de vérification')}
else if(A=='conf'){await ok(q('sessions',{conf:true}));toast('Séance validée')}
else if(A=='payok'){await ok(q('sessions',{pay:'Paiement vérifié par l’équipe'}))}
else if(A=='solve'){await ok(q('reports',{st:'Traité'}))}
await load();render()}catch(err){if(!err||!err.shown)toast('Erreur réseau, réessayez')}});
document.addEventListener('submit',async e=>{const f=e.target.closest('[data-f]');if(!f)return;e.preventDefault();const b=f.querySelector('button');if(b){if(b.disabled)return;b.disabled=true}
const fd=new FormData(f),o=Object.fromEntries(fd),id=f.dataset.id,K=f.dataset.f,u=cur(),now=()=>new Date().toLocaleString('fr-FR');['mat','niv'].forEach(k=>o[k]=fd.getAll(k));
try{
if(K=='cmsg'){const {error}=await SB.rpc('child_send',{tok:CT,t:o.txt});if(error)return toast(/répétiteur/.test(error.message)?'Tu n’as pas encore de répétiteur':'Message non envoyé');toast('Message envoyé');return childLoad(CT)}
if(viewing()&&['req','avis','signal','kid'].includes(K))return toast('Action réservée au propriétaire du compte');
if(K=='signup'){if(o.role=='rep'&&(!o.mat.length||!o.niv.length))return toast('Choisissez au moins une matière et un niveau');
const {data,error}=await SB.auth.signUp({email:o.email,password:o.pw});if(error)return toast(/registered|exists/i.test(error.message)?'Cet email a déjà un compte':'Erreur : '+error.message);
if(!data.session)return toast('Compte créé : confirmez votre email puis connectez-vous');
const uid=data.user.id,P={id:uid,role:o.role,nom:o.nom,tel:o.tel,email:o.email,quartier:o.quartier,st:'attente'};
if(o.role=='rep'){const fl=o.fcarte,ex=((fl.name||'').split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg',path=`${uid}/carte.${ex}`,up=await SB.storage.from('cartes').upload(path,fl);if(up.error)return toast('Envoi de la carte impossible : '+up.error.message);Object.assign(P,{mat:o.mat,niv:o.niv,dispo:o.dispo,docs:{carte:path,ecole:o.ecole,filiere:o.filiere,num:o.num}})}
await ok(SB.from('profiles').insert(P));D.me=uid;obs=false;await load();toast(o.role=='rep'?'Inscription reçue : vous êtes en attente':'Compte créé');if(o.role=='parent')tab.parent='k';return go('espace')}
if(K=='login'){const {data,error}=await SB.auth.signInWithPassword({email:o.email,password:o.pw});if(error)return toast('Email ou mot de passe incorrect');D.me=data.user.id;await load();const m=me();if(!m||m.role!=o.role){await SB.auth.signOut();clear();return toast('Ce compte n’est pas un compte '+PORT[o.role].toLowerCase())}obs=false;return go('espace')}
if(K=='req'){if(!o.mat.length)return toast('Choisissez au moins une matière');const k=D.children.find(c=>c.id==o.child);await ok(SB.from('requests').insert({pid:u.id,child_id:k.id,enfant:k.prenom,niveau:k.niveau,mat:o.mat,type:o.type,quartier:o.quartier,budget:o.budget||null,dispo:o.dispo,exam:!!o.exam}));tab.parent='d';toast('Demande envoyée. L’équipe vous répondra.');await load();return go('espace')}
if(K=='kid'){await ok(SB.from('children').insert({pid:u.id,prenom:o.prenom,niveau:o.niveau,a_telephone:!!o.tel}));toast('Enfant ajouté')}
if(K=='assign'){const R=D.req.find(r=>r.id==id);await ok(SB.from('requests').update({rid:o.rid,st:'Affectée'}).eq('id',id));await ok(SB.from('sessions').insert({qid:id,pid:R.pid,rid:o.rid,date:o.date,heure:o.heure,st:'Prévue',pay:'Non payé'}));toast('Répétiteur affecté')}
if(K=='fiche'){await ok(SB.from('sessions').update({fiche:{notions:o.notions,niveau:o.niveau,devoirs:o.devoirs,obs:o.obs},st:'Réalisée'}).eq('id',id));toast('Fiche enregistrée')}
if(K=='avis'){await ok(SB.from('reports').insert({sid:id,kind:'avis',note:+o.note,txt:o.txt}));toast('Merci pour votre avis')}
if(K=='signal'){await ok(SB.from('reports').insert({sid:id,kind:'signal',txt:o.txt,st:'Ouvert'}));toast('Signalement envoyé à l’équipe')}
if(K=='cfg'){D.cfg={...D.cfg,prix:+o.prix,sc:+o.sc,grp:+o.grp,zone:o.zone,wa:o.wa.replace(/\D/g,''),mail:o.mail};await ok(SB.from('settings').upsert({k:'cfg',v:D.cfg}));toast('Paramètres enregistrés')}
if(K=='rdv'){await ok(SB.from('profiles').update({rdv:{date:o.date,heure:o.heure,lieu:o.lieu},st:'rdv'}).eq('id',id));await ok(SB.from('messages').insert({to_id:id,txt:`Rendez-vous fixé le ${o.date} à ${o.heure}, lieu : ${o.lieu}.`}));toast('Rendez-vous fixé')}
if(K=='msg'){const to=me().role=='admin'?o.to:f.dataset.to;await ok(SB.from('messages').insert(to&&to[0]=='k'?{child_id:+to.slice(1),to_id:null,txt:o.txt}:{to_id:to&&to!='0'?to:null,txt:o.txt}));toast('Message envoyé')}
await load();render()}catch(err){if(!err||!err.shown)toast('Erreur réseau, réessayez')}finally{if(b)b.disabled=false}});

boot();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
