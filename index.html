<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tutora + | Réussir, près de chez vous</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0B2A5B"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='11' fill='%23F7B32B'/%3E%3Cpath d='M7 19.5 20 8l13 11.5M11 18v13h18V18M20 22v9' fill='none' stroke='%230B2A5B' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--hero:#0B2A5B;--amber:#F7B32B;--paper:#fff;--wash:#F2F6FC;--card:#fff;--ink:#0F2547;--soft:#4A5E80;--line:#D3DEEF;--blue:#1F55B8;--green:#0E8A5A;--gbg:#DCF3E8;--danger:#B3261E;--shadow:0 24px 48px -24px rgba(11,42,91,.45);--display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;--body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--hero:#081C42;--paper:#0A1A38;--wash:#0D2146;--card:#102650;--ink:#EAF0FC;--soft:#A8B9D8;--line:#264373;--blue:#8DB1F5;--green:#4FD6A0;--gbg:#0F3A2F;--danger:#FF8F86;--shadow:0 24px 48px -24px rgba(0,0,0,.7)}}
:root[data-theme=dark]{--hero:#081C42;--paper:#0A1A38;--wash:#0D2146;--card:#102650;--ink:#EAF0FC;--soft:#A8B9D8;--line:#264373;--blue:#8DB1F5;--green:#4FD6A0;--gbg:#0F3A2F;--danger:#FF8F86}
html{scroll-padding-top:calc(72px + env(safe-area-inset-top,0px));scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}*{margin:0}
body{font-family:var(--body);background:var(--paper);color:var(--ink);line-height:1.6;font-size:1.0625rem;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);letter-spacing:-.03em;line-height:1.08}
h1{font-size:clamp(2.3rem,7vw,4rem);font-weight:800}h2{font-size:clamp(1.7rem,4.5vw,2.6rem);font-weight:700}h3{font-size:1.15rem;font-weight:700}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px;border-radius:4px}
[hidden]{display:none!important}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}.sec{padding:clamp(44px,8vw,84px) 0}.wash{background:var(--wash)}
.sub,.lead{color:var(--soft);margin-top:12px;max-width:58ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 24px;border-radius:999px;border:2px solid transparent;font:700 1rem var(--body);text-decoration:none;cursor:pointer;color:inherit;background:none}
.btn:hover{filter:brightness(1.07)}.amber{background:var(--amber);color:#0B2A5B}.light{border-color:rgba(255,255,255,.5);color:#fff}.line{border-color:var(--line)}.sm{min-height:40px;padding:6px 16px;font-size:.92rem}.red{color:var(--danger);border-color:var(--danger)}
.top{position:sticky;top:0;z-index:20;background:var(--hero);color:#fff}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px}
.brand{display:inline-flex;align-items:center;gap:10px;font:800 1.45rem var(--display);text-decoration:none;color:#fff;cursor:pointer}.brand b{color:var(--amber)}
.top nav{display:flex;align-items:center;gap:20px;font-weight:600;font-size:.95rem}.top nav a:not(.btn){color:rgba(255,255,255,.85);text-decoration:none;cursor:pointer}
@media(max-width:760px){.top nav a:not(.btn){display:none}}
.hero{background:var(--hero);color:#fff;padding:clamp(40px,8vw,84px) 0}.hero .sub{color:rgba(255,255,255,.85);font-size:1.15rem}
.row{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin-top:28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow)}
.card h3{margin-bottom:6px}.card p{color:var(--soft)}
.n{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--amber);color:#0B2A5B;font:800 1.1rem var(--display);margin-bottom:10px}
.tag{display:inline-block;padding:2px 12px;border-radius:999px;background:var(--wash);border:1px solid var(--line);font-size:.85rem;font-weight:600;margin:2px 4px 2px 0}
.ok{background:var(--gbg);color:var(--green);border-color:transparent}.warn{background:#FFF1CC;color:#7A5200;border-color:transparent}.bad{background:#FBE0DE;color:var(--danger);border-color:transparent}
.price{font:800 2rem var(--display)}
.note{border-left:5px solid var(--amber);background:var(--wash);padding:12px 16px;border-radius:10px;font-size:.95rem;margin-top:18px}
form{display:grid;gap:14px}label{display:grid;gap:6px;font-weight:600;font-size:.95rem}
input,select,textarea{font:inherit;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:12px 14px;min-height:48px;width:100%}
input[type=checkbox],input[type=radio]{width:20px;height:20px;min-height:0;accent-color:var(--blue)}
.chk{display:flex;flex-wrap:wrap;gap:8px 18px}.chk label{display:flex;align-items:center;gap:8px;font-weight:500}
.two{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin:18px 0}.tabs .btn{white-space:nowrap}.tabs .on{background:var(--hero);color:#fff}
.item{border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--card);margin-bottom:12px;display:grid;gap:8px}
.item small{color:var(--soft)}.acts{display:flex;flex-wrap:wrap;gap:8px}
.faq details{border-bottom:1px solid var(--line);padding:14px 0}.faq summary{font-weight:700;cursor:pointer}.faq p{color:var(--soft);margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--hero);color:#fff;padding:12px 22px;border-radius:999px;font-weight:600;z-index:50;box-shadow:var(--shadow)}
footer a{color:#fff;cursor:pointer}footer{background:var(--hero);color:rgba(255,255,255,.8);padding:30px 0;font-size:.92rem}
.empty{color:var(--soft);padding:14px 0}.mob{display:none}@media(max-width:760px){.mob{display:block}}.narrow{max-width:560px;margin:0 auto}
</style></head><body>
<header class="top"><div class="wrap bar">
<a class="brand" data-go="accueil"><svg width="34" height="34" viewBox="0 0 40 40"><rect width="40" height="40" rx="11" fill="#F7B32B"/><path d="M7 19.5 20 8l13 11.5M11 18v13h18V18M20 22v9" fill="none" stroke="#0B2A5B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>Tutora<b>+</b></a>
<nav><span id="pub" style="display:contents" hidden><a data-go="fonctionnement">Fonctionnement</a><a data-go="tarifs">Tarifs</a><a data-go="faq">Questions</a></span><button class="btn light sm" id="inst" hidden data-act="inst">Installer l’appli</button><span id="navr"></span></nav></div></header>
<main id="app"></main>
<footer><div class="wrap" id="ft"></div></footer>
<div class="toast" id="toast" hidden></div>
<script>
const MAT={Primaire:['Lecture','Écriture','Calcul','Grammaire'],Collège:['Mathématiques','Physique','Chimie','Français','Biologie']};
let D;try{D=JSON.parse(localStorage.getItem('tp'))}catch(e){}
D=D||{u:[{id:1,role:'admin',nom:'Équipe Tutora +',email:'admin@tutora.gn',pw:'admin123'}],me:null,req:[],ses:[],rep:[],cfg:{prix:25000,sc:8,grp:'120 000 à 140 000'},id:10};
D.msg=D.msg||[];D.view=D.view||null;let ip,obs=false;
if(D.v!=5){D.cfg={prix:25000,sc:8,grp:20000,wa:'224612202678',mail:'lilafna224@gmail.com',zone:'Haphia',pay:'Soutra Money'};D.u=D.u.map(x=>x.id==1?{...x,nom:'Ismaël Barry',email:'lilafna224@gmail.com',pw:'tutora2026'}:x);D.v=5}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();ip=e;$('#inst').hidden=false});try{obs=sessionStorage.getItem("obs")=="1"}catch(e){}
const save=()=>{try{localStorage.setItem('tp',JSON.stringify(D))}catch(e){}};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const me=()=>D.u.find(u=>u.id==D.me),U=id=>D.u.find(u=>u.id==id)||{},nid=()=>++D.id,gnf=n=>Number(n).toLocaleString('fr-FR').replace(/\u202f/g,' ')+' GNF';
let tab={};const toast=t=>{const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2800)};
const tags=a=>(a||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join('');
const chk=(n,a)=>`<div class="chk">${a.map(x=>`<label><input type="checkbox" name="${n}" value="${esc(x)}">${esc(x)}</label>`).join('')}</div>`;
const allMat=()=>[...MAT.Primaire,...MAT.Collège];
const stc=s=>/[Vv]alid|Accept|Réalis|vérifié|Traité/.test(s)?'ok':/Refus|Annul/.test(s)?'bad':'warn';
const st=s=>`<span class="tag ${stc(s)}">${esc(s)}</span>`;

function home(){return `
<section class="hero"><div class="wrap"><h1>Réussir,<br>près de chez vous.</h1>
<p class="sub">Tutora + met en relation les familles et des étudiants-répétiteurs de votre quartier à Conakry, pour le primaire et le collège.</p>
<div class="row"><a class="btn amber" data-go="entree">Me connecter ou créer un compte</a><a class="btn light" target="_blank" rel="noopener" href="${wa('Bonjour Tutora +, je souhaite des informations.')}">Écrire sur WhatsApp</a></div><p class="sub" style="font-size:1rem">Pilote lancé à ${esc(D.cfg.zone)}.</p></div></section>
<div class="wrap mob"><div class="tabs" style="margin:14px 0 0"><a class="btn sm line" data-go="fonctionnement">Fonctionnement</a><a class="btn sm line" data-go="tarifs">Tarifs</a><a class="btn sm line" data-go="faq">Questions</a></div></div><section class="sec" id="fonctionnement"><div class="wrap"><h2>Comment ça marche</h2><p class="lead">Quatre étapes, depuis votre téléphone.</p>
<div class="grid">${[['Vous faites une demande','Niveau, matières, quartier, budget et horaires.'],['L’équipe choisit un profil','Un répétiteur dont le dossier a été validé, proche de chez vous.'],['La séance a lieu','Le répétiteur remplit une fiche après chaque cours.'],['Vous suivez les progrès','Notions travaillées, devoirs, avis et signalement si besoin.']].map((s,i)=>`<div class="card"><div class="n">${i+1}</div><h3>${s[0]}</h3><p>${s[1]}</p></div>`).join('')}</div></div></section>
<section class="sec wash"><div class="wrap"><h2>Niveaux et matières</h2><p class="lead">Avec une attention particulière à la préparation du CEE et du BEPC.</p>
<div class="grid"><div class="card"><h3>Primaire</h3>${tags(MAT.Primaire)}</div><div class="card"><h3>Collège</h3>${tags(MAT.Collège)}</div><div class="card"><h3>Cours individuel</h3><p>Un répétiteur, un élève.</p></div><div class="card"><h3>Cours de groupe</h3><p>4 à 6 élèves du même quartier et de niveau compatible.</p></div></div></div></section>
<section class="sec" id="tarifs"><div class="wrap"><h2>Tarifs</h2><p class="lead">Tarifs indicatifs du pilote, à confirmer.</p>
<div class="grid"><div class="card"><h3>Individuel</h3><div class="price">${gnf(D.cfg.prix*D.cfg.sc)}</div><p>par mois · ${D.cfg.sc} séances à ${gnf(D.cfg.prix)}</p></div><div class="card"><h3>Groupe</h3><div class="price">${gnf(D.cfg.grp)}</div><p>par élève et par séance · 4 à 6 élèves du même quartier</p></div></div>
<div class="note"><b>Paiement :</b> vous ne payez pas séance par séance. Après les séances du mois, validées par vous, la facture est établie. Paiement par ${esc(D.cfg.pay)} au ${pn()}. Tarifs du pilote, susceptibles d’évoluer.</div></div></section>
<section class="sec wash"><div class="wrap"><h2>Répétiteurs : validation réelle</h2><p class="lead">Un profil n’est présenté comme validé qu’après vérification de sa carte d’étudiant et un rendez-vous avec l’équipe.</p></div></section>
<section class="sec faq" id="faq"><div class="wrap"><h2>Questions</h2>
${[['Qui sont les répétiteurs ?','Des étudiants dont la carte d’étudiant est vérifiée, puis reçus en rendez-vous par l’équipe avant validation.'],['Comment est choisi le répétiteur ?','L’équipe Tutora + choisit le profil adapté à votre quartier, au niveau et aux horaires de votre demande.'],['Combien ça coûte ?',`${gnf(D.cfg.prix)} la séance en individuel (${gnf(D.cfg.prix*D.cfg.sc)} pour ${D.cfg.sc} séances), ${gnf(D.cfg.grp)} par élève et par séance en groupe.`],['Quand et comment je paie ?',`Après les séances du mois, par ${D.cfg.pay}, une fois la facture établie. Pas de paiement à l’avance.`],['Comment une séance est-elle validée ?','Le répétiteur remplit la fiche de séance, puis vous confirmez sa présence dans votre espace.'],['Je dois annuler ou reporter une séance','Envoyez un message à Tutora + par WhatsApp ou email avec le motif. Le bouton est dans votre planning.'],['J’ai un problème, puis-je être remboursé ?','Signalez-le ou contactez Tutora +. Un remboursement est possible après une plainte validée par l’équipe.'],['Mon enfant aura-t-il son compte ?','Les comptes élèves arrivent bientôt. Le parent verra toujours tous les messages de son enfant.'],['Où êtes-vous disponibles ?',`Le pilote démarre à ${D.cfg.zone}.`]].map(q=>`<details><summary>${q[0]}</summary><p>${q[1]}</p></details>`).join('')}</div></section>`}

const PORT={parent:'Parent',rep:'Répétiteur',admin:'Administrateur'},RL={attente:'En attente',rdv:'Rendez-vous fixé',valide:'Profil validé',refuse:'Profil refusé'};
const viewing=()=>{const a=me();return a&&a.role=='admin'&&D.view&&D.u.some(x=>x.id==D.view)?U(D.view):null},cur=()=>viewing()||me();
const who=id=>id==0||U(id).role=='admin'?'L’équipe':U(id).nom,now=()=>new Date().toLocaleString('fr-FR');
const wa=t=>`https://wa.me/${D.cfg.wa}?text=${encodeURIComponent(t)}`,pn=()=>'+224 '+D.cfg.wa.slice(3).replace(/(\d{3})(\d{2})(\d{2})(\d{2})/,'$1 $2 $3 $4');
const cancel=s=>{const q=D.req.find(r=>r.id==s.qid)||{},t=`Demande d’annulation ou de report : séance du ${s.date} à ${s.heure} (${q.enfant}). Motif : `;return `<div class="acts"><a class="btn sm line" target="_blank" rel="noopener" href="${wa(t)}">Annuler ou reporter (WhatsApp)</a><a class="btn sm line" href="mailto:${esc(D.cfg.mail)}?subject=${encodeURIComponent('Annulation de séance')}&body=${encodeURIComponent(t)}">Par email</a></div>`};
function bill(u){const open=D.ses.filter(s=>s.pid==u.id&&s.conf&&s.pay=='Non payé'),n=open.length,pr=s=>(D.req.find(r=>r.id==s.qid)?.type||'').startsWith('Groupe')?D.cfg.grp:D.cfg.prix,tot=open.reduce((a,s)=>a+pr(s),0);
return `<div class="card" style="margin-bottom:14px"><h3>Facturation</h3>${n>=D.cfg.sc?`<p><b>${n} séances validées : ${gnf(tot)}</b> à payer par ${esc(D.cfg.pay)} au ${pn()} (indiquez votre nom en référence).</p><button class="btn amber sm" data-act="paydecl" data-id="0">J’ai payé</button>`:`<p>${n} séance(s) validée(s) sur ${D.cfg.sc}. La facture est établie après ${D.cfg.sc} séances validées : aucun paiement avant.</p>`}</div>`}
const cons=role=>`<label class="chk" style="display:flex;gap:10px;align-items:flex-start;font-weight:500"><input type="checkbox" name="ok" required><span>J’ai lu et j’accepte les <a href="#conditions" target="_blank" style="text-decoration:underline">conditions d’utilisation</a> et la <a href="#confidentialite" target="_blank" style="text-decoration:underline">politique de confidentialité</a>${role=='parent'?'. J’autorise Tutora + à traiter les données de mon enfant pour le soutien scolaire.':'. J’autorise la vérification de ma carte d’étudiant.'}</span></label>`;
function legal(k){const C=[['Conditions d’utilisation',[['Objet','Tutora + met en relation des familles et des étudiants-répétiteurs. Tutora + n’est pas l’employeur des répétiteurs.'],['Comptes','Chacun protège ses identifiants et fournit des informations exactes.'],['Répétiteurs','Un profil n’est validé qu’après vérification de la carte d’étudiant et un rendez-vous avec l’équipe.'],['Validation d’une séance','Une séance est validée quand le répétiteur remplit la fiche et que le parent confirme sa présence sur la plateforme.'],['Annulation','Toute annulation ou report se demande à Tutora + par message (WhatsApp ou email) avec le motif, par le parent ou le répétiteur.'],['Paiement','Le parent paie après les séances du mois (4 semaines), par Soutra Money. Le répétiteur est payé via la plateforme après ses 8 séances. Un remboursement n’est possible qu’après une plainte validée par Tutora +.'],['Litiges','Contactez directement Tutora +, qui examine la situation.'],['Conduite','Contourner la plateforme ou tout comportement inapproprié envers un enfant peut entraîner la suppression du compte.']]],['Politique de confidentialité et consentement',[['Données collectées','Identité, contact, quartier, niveau scolaire de l’enfant, historique des séances et messages ; pour les répétiteurs, informations de la carte d’étudiant.'],['Usage','Organiser les cours, suivre les progrès, vérifier les répétiteurs et traiter les litiges. Aucune vente de données.'],['Accès','Chaque utilisateur ne voit que son espace. L’équipe Tutora + a accès à l’ensemble. Le parent voit tous les messages de son enfant.'],['Enfants','Le parent consent au traitement des données de son enfant et peut retirer ce consentement à tout moment.'],['Messages WhatsApp et SMS','Ils ne contiennent que les informations nécessaires.'],['Vos droits',`Pour consulter, corriger ou supprimer vos données : ${D.cfg.mail}.`]]]][k];
return `<section class="sec"><div class="wrap narrow"><h2>${C[0]}</h2><div class="note">Brouillon à faire valider avant la mise en production.</div>${C[1].map(x=>`<h3 style="margin-top:20px">${x[0]}</h3><p class="lead" style="margin-top:6px">${x[1]}</p>`).join('')}</div></section>`}
function entree(){const c=(go,n,t,d)=>`<a class="card" data-go="${go}" style="display:block;text-decoration:none;color:inherit;cursor:pointer"><div class="n">${n}</div><h3>${t}</h3><p>${d}</p></a>`;
return `<section class="sec"><div class="wrap"><h1 style="font-size:clamp(2rem,6vw,3.2rem)">Bienvenue sur Tutora +</h1><p class="lead">Pour commencer, dites-nous qui vous êtes.</p><div class="grid">${c('parent-connexion',1,'Je suis parent','Je me connecte ou je crée mon compte pour trouver un répétiteur.')}${c('rep-connexion',2,'Je suis répétiteur','Je me connecte ou je m’inscris avec ma carte d’étudiant.')}${c('observer',3,'Je visite le site','Je consulte simplement les informations publiques.')}</div><p style="margin-top:28px"><a data-go="admin-connexion" style="cursor:pointer;text-decoration:underline;color:var(--soft)">Accès administrateur</a></p></div></section>`}
function auth(role,mode){const sign=mode=='inscription'&&role!='admin',rep=role=='rep';
return `<section class="sec"><div class="wrap narrow"><a data-go="entree" style="cursor:pointer;color:var(--soft)">← Changer de profil</a><h2 style="margin-top:10px">${PORT[role]} : ${sign?'créer un compte':'se connecter'}</h2>
${role!='admin'?`<div class="tabs"><a class="btn sm line ${!sign?'on':''}" data-go="${role}-connexion">J’ai déjà un compte</a><a class="btn sm line ${sign?'on':''}" data-go="${role}-inscription">Créer un compte</a></div>`:'<p class="lead">Accès réservé à l’équipe Tutora +.</p>'}
<form data-f="${sign?'signup':'login'}" style="margin-top:16px"><input type="hidden" name="role" value="${role}">
${sign?`<label>Nom complet<input name="nom" required></label><label>Téléphone / WhatsApp<input name="tel" type="tel" required></label><label>Quartier<input name="quartier" required></label>`:''}
<label>Email<input name="email" type="email" required></label><label>Mot de passe<input name="pw" type="password" minlength="6" required></label>
${sign&&rep?`<label>Matières enseignées${chk('mat',allMat())}</label><label>Niveaux pris en charge${chk('niv',['Primaire','Collège'])}</label><label>Disponibilités<input name="dispo" placeholder="Ex. lun–ven après 17 h" required></label>
<h3>Votre carte d’étudiant</h3><label>Établissement<input name="ecole" required></label><div class="two"><label>Filière et année d’études<input name="filiere" required></label><label>N° de carte d’étudiant<input name="num" required></label></div><label>Photo ou scan de la carte<input type="file" name="fcarte" accept="image/*,.pdf" required></label>
<div class="note">Après votre inscription, votre profil sera mis en attente. L’équipe vérifiera votre carte puis vous donnera un rendez-vous.</div>`:''}
${sign?cons(role):''}<button class="btn amber">${sign?'Créer mon compte':'Me connecter'}</button></form></div></section>`}
function msgs(u){const ro=!!viewing();
if(u.role=='admin')return `<form data-f="msg" class="card" style="margin-bottom:14px"><label>Écrire à<select name="to" required><option value="">Choisir…</option>${D.u.filter(x=>x.role!='admin').map(x=>`<option value="${x.id}">${esc(x.nom)} (${x.role=='rep'?'répétiteur':'parent'})</option>`).join('')}</select></label><label>Message<textarea name="txt" required></textarea></label><button class="btn sm amber">Envoyer</button></form><h3>Tous les messages</h3><div style="margin-top:12px">${[...D.msg].reverse().map(m=>`<div class="item"><small>${esc(m.t)} · ${esc(U(m.from).nom)} → ${esc(who(m.to))}</small>${esc(m.txt)}</div>`).join('')||'<p class="empty">Aucun message.</p>'}</div>`;
const par=u.role=='parent',ps=[...new Set(D.ses.filter(s=>par?s.pid==u.id:s.rid==u.id).map(s=>par?s.rid:s.pid))],c=tab.mc!=null&&(tab.mc==0||ps.includes(tab.mc))?tab.mc:0,
th=D.msg.filter(m=>c==0?(m.from==u.id&&m.to==0)||(m.to==u.id&&U(m.from).role=='admin'):(m.from==u.id&&m.to==c)||(m.from==c&&m.to==u.id));
return `<div class="tabs">${[0,...ps].map(i=>`<button class="btn sm line ${i==c?'on':''}" data-act="ct" data-id="${i}">${esc(who(i))}</button>`).join('')}</div>${th.map(m=>`<div class="item" style="max-width:88%;${m.from==u.id?'margin-left:auto;background:var(--wash)':''}"><small>${esc(m.t)} · ${m.from==u.id?'Vous':esc(who(m.from))}</small>${esc(m.txt)}</div>`).join('')||'<p class="empty">Aucun message.</p>'}${ro?'':`<form data-f="msg" data-to="${c}" style="margin-top:14px"><label>Votre message<textarea name="txt" required></textarea></label><button class="btn sm amber">Envoyer</button></form>`}`}

function reqForm(){const u=cur();if(!u||u.role!='parent')return '<section class="sec"><div class="wrap narrow"><h2>Demander un répétiteur</h2><p class="lead">Cette page est réservée aux comptes parents.</p></div></section>';
return `<section class="sec"><div class="wrap narrow"><h2>Demander un répétiteur</h2><form data-f="req" style="margin-top:20px">
<div class="two"><label>Prénom de l’enfant<input name="enfant" required></label><label>Niveau<select name="niveau"><option>Primaire</option><option>Collège</option></select></label></div>
<label>Matières${chk('mat',allMat())}</label><label class="chk"><span style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="exam" value="1">Préparation au CEE ou au BEPC</span></label>
<div class="two"><label>Type de cours<select name="type"><option>Individuel</option><option>Groupe (4 à 6 élèves)</option></select></label><label>Quartier<input name="quartier" value="${esc(u.quartier)}" required></label></div>
<div class="two"><label>Budget mensuel (facultatif)<input name="budget" placeholder="Ex. 200 000 GNF"></label><label>Jours et heures disponibles<input name="dispo" required placeholder="Ex. mar. et jeu. après 17 h"></label></div>
<button class="btn amber">Envoyer ma demande</button></form></div></section>`}

const T=(role,list)=>{const t=list.some(x=>x[0]==tab[role])?tab[role]:list[0][0];return `<div class="tabs">${list.map(([k,l])=>`<button class="btn sm line ${k==t?'on':''}" data-act="tab" data-r="${role}" data-v="${k}">${l}</button>`).join('')}</div>`};
const sesLine=s=>`<b>${esc(s.date)} à ${esc(s.heure)}</b> · ${esc(D.req.find(r=>r.id==s.qid)?.enfant)} ${st(s.st)}`;

function space(){const u=cur(),h=u.role=='parent'?parent(u):u.role=='rep'?tutor(u):admin();
return `<section class="sec"><div class="wrap">${viewing()?`<div class="note" style="margin:0 0 16px">Vous consultez l’espace de <b>${esc(u.nom)}</b> en tant qu’administrateur. <button class="btn sm line" data-act="unview">Retour à mon espace</button></div>`:''}<div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center"><div><h2>Bonjour ${esc(u.nom.split(' ')[0])}</h2><p class="lead" style="margin:4px 0 0">Espace ${{parent:'parent',rep:'répétiteur',admin:'administrateur'}[u.role]}</p></div><button class="btn line sm" data-act="logout">Se déconnecter</button></div>${h}</div></section>`}

function parent(u){const L=[['d','Mes demandes'],['p','Planning'],['s','Suivi et avis'],['m','Messages']],t=tab.parent||'d',mine=D.req.filter(r=>r.pid==u.id),ses=D.ses.filter(s=>s.pid==u.id);let b='';
if(t=='d')b=`<a class="btn amber" data-go="demande">+ Nouvelle demande</a><div style="margin-top:16px">${mine.map(r=>`<div class="item"><b>${esc(r.enfant)} · ${esc(r.niveau)} · ${esc(r.type)}</b><div>${tags(r.mat)}${r.exam?'<span class="tag">CEE/BEPC</span>':''}</div><small>${esc(r.quartier)} · ${esc(r.dispo)}${r.budget?' · '+esc(r.budget):''}</small><div>${st(r.st)}</div></div>`).join('')||'<p class="empty">Aucune demande pour l’instant.</p>'}</div>`;
if(t=='p')b=ses.map(s=>{const rq=D.req.find(r=>r.id==s.qid);return `<div class="item">${sesLine(s)}<small>Répétiteur : ${esc(U(s.rid).nom)} · ${rq.st=='Affectée'?'en attente de son acceptation':'confirmée'}</small>${cancel(s)}</div>`}).join('')||'<p class="empty">Aucune séance prévue.</p>';
if(t=='s')b=bill(u)+ses.filter(s=>s.st=='Réalisée').map(s=>{const f=s.fiche,av=D.rep.find(x=>x.sid==s.id&&x.kind=='avis');return `<div class="item">${sesLine(s)}<div><b>Notions :</b> ${esc(f.notions)}<br><b>Niveau perçu :</b> ${esc(f.niveau)}<br><b>Devoirs :</b> ${esc(f.devoirs||'—')}<br><b>Remarques :</b> ${esc(f.obs||'—')}</div>
<div>${s.conf?st('Séance validée')+' '+st(s.pay):`<button class="btn sm amber" data-act="conf" data-id="${s.id}">Je confirme la présence du répétiteur</button>`}</div>
${av?`<div>Votre avis : ${'★'.repeat(av.note)}${'☆'.repeat(5-av.note)} ${esc(av.txt)}</div>`:`<form data-f="avis" data-id="${s.id}"><div class="two"><label>Note<select name="note"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></label><label>Commentaire<input name="txt"></label></div><button class="btn sm amber">Publier mon avis</button></form>`}
<details><summary>Signaler un problème</summary><form data-f="signal" data-id="${s.id}" style="margin-top:10px"><label>Absence, qualité, litige…<textarea name="txt" required></textarea></label><button class="btn sm red">Envoyer à l’équipe</button></form></details></div>`}).join('')||'<p class="empty">Les fiches de séance apparaîtront ici après chaque cours.</p>';
if(t=='m')b=msgs(u);return T('parent',L)+b}

function tutor(u){const ok=u.st=='valide',L=ok?[['pr','Mon profil'],['dm','Demandes'],['pl','Planning et fiches'],['hi','Historique'],['ms','Messages']]:[['pr','Mon profil'],['ms','Messages']],t=L.some(x=>x[0]==tab.rep)?tab.rep:'pr',ses=D.ses.filter(s=>s.rid==u.id);let b='';
if(t=='pr')b=`<div class="item"><div>${st(RL[u.st])}</div><div>${tags(u.mat)}${tags(u.niv)}</div><small>${esc(u.quartier)} · ${esc(u.dispo)} · ${esc(u.tel)}</small><small>Carte d’étudiant : ${esc(u.docs?.ecole)}, ${esc(u.docs?.filiere)}, N° ${esc(u.docs?.num)}</small></div>`+(u.rdv&&u.st!='valide'?`<div class="note"><b>Rendez-vous :</b> ${esc(u.rdv.date)} à ${esc(u.rdv.heure)} · ${esc(u.rdv.lieu)}</div>`:'')+(u.st=='attente'?'<div class="note">Votre inscription est bien reçue. L’équipe va vérifier votre carte d’étudiant puis vous donner un rendez-vous. Vous êtes en attente.</div>':u.st=='refuse'?'<div class="note">Votre profil n’a pas été retenu. Écrivez à l’équipe dans Messages.</div>':'');
if(t=='dm')b=D.req.filter(r=>r.rid==u.id&&r.st=='Affectée').map(r=>`<div class="item"><b>${esc(r.enfant)} · ${esc(r.niveau)} · ${esc(r.type)}</b><div>${tags(r.mat)}</div><small>${esc(r.quartier)} · ${esc(r.dispo)}</small><div class="acts"><button class="btn sm amber" data-act="acc" data-id="${r.id}">Accepter</button><button class="btn sm red" data-act="ref" data-id="${r.id}">Refuser</button></div></div>`).join('')||'<p class="empty">Aucune demande à traiter.</p>';
if(t=='pl')b=ses.filter(s=>s.st=='Prévue').map(s=>`<div class="item">${sesLine(s)}${cancel(s)}<details><summary>Remplir la fiche de séance</summary><form data-f="fiche" data-id="${s.id}" style="margin-top:10px"><label>Points étudiés<textarea name="notions" required></textarea></label><label>Niveau constaté<select name="niveau" required><option value="">Choisir…</option><option>Insuffisant</option><option>Moyen</option><option>Bien</option><option>Très bien</option></select></label><label>Devoirs à faire<input name="devoirs"></label><label>Remarques<input name="obs"></label><button class="btn sm amber">Enregistrer la fiche</button></form></details></div>`).join('')||'<p class="empty">Aucune séance à venir.</p>';
if(t=='hi')b=ses.filter(s=>s.st=='Réalisée').map(s=>{const a=D.rep.find(x=>x.sid==s.id&&x.kind=='avis');return `<div class="item">${sesLine(s)}<small>${a?'Avis : '+'★'.repeat(a.note)+' '+esc(a.txt):'Pas encore d’avis'}</small></div>`}).join('')||'<p class="empty">Aucune séance effectuée.</p>';
if(t=='ms')b=msgs(u);return T('rep',L)+b}

function admin(){const L=[['c','Comptes'],['q','Demandes'],['s','Séances'],['g','Signalements'],['m','Messages'],['x','Paramètres']],t=tab.admin||'c';let b='';
const reps=D.u.filter(x=>x.role=='rep'&&x.st=='valide');
if(t=='c')b=D.u.filter(x=>x.role!='admin').map(x=>`<div class="item"><b>${esc(x.nom)}</b> ${st(x.role=='rep'?RL[x.st]:'Parent')}<small>${esc(x.email)} · ${esc(x.tel)} · ${esc(x.quartier)}</small>${x.role=='rep'?`<div>${tags(x.mat)}${tags(x.niv)}</div><small>${esc(x.dispo)}</small><small>Carte d’étudiant : ${esc(x.docs?.carte)} · ${esc(x.docs?.ecole)} · ${esc(x.docs?.filiere)} · N° ${esc(x.docs?.num)}</small>${x.rdv?`<small>Rendez-vous : ${esc(x.rdv.date)} à ${esc(x.rdv.heure)} · ${esc(x.rdv.lieu)}</small>`:''}${x.st=='attente'||x.st=='rdv'?`<form data-f="rdv" data-id="${x.id}" class="two"><label>Date<input type="date" name="date" required></label><label>Heure<input type="time" name="heure" required></label><label>Lieu<input name="lieu" required></label><button class="btn sm line">${x.st=='rdv'?'Changer':'Fixer'} le rendez-vous</button></form><div class="acts">${x.st=='rdv'?`<button class="btn sm amber" data-act="val" data-id="${x.id}">Valider le profil</button>`:''}<button class="btn sm red" data-act="rej" data-id="${x.id}">Refuser</button></div>`:''}`:''}<div class="acts"><button class="btn sm line" data-act="view" data-id="${x.id}">Ouvrir son espace</button></div></div>`).join('')||'<p class="empty">Aucun compte.</p>';
if(t=='q')b=D.req.map(r=>`<div class="item"><b>${esc(r.enfant)} · ${esc(r.niveau)} · ${esc(r.type)}</b> ${st(r.st)}<div>${tags(r.mat)}</div><small>Parent : ${esc(U(r.pid).nom)} · ${esc(r.quartier)} · ${esc(r.dispo)}${r.budget?' · '+esc(r.budget):''}</small>${r.st=='Nouvelle'||r.st.startsWith('Refus')?`<form data-f="assign" data-id="${r.id}" class="two"><label>Répétiteur<select name="rid" required><option value="">Choisir…</option>${reps.map(x=>`<option value="${x.id}">${esc(x.nom)} (${esc(x.quartier)})</option>`).join('')}</select></label><label>Date<input type="date" name="date" required></label><label>Heure<input type="time" name="heure" required></label><button class="btn sm amber">Affecter</button></form>`:`<small>Répétiteur : ${esc(U(r.rid).nom)}</small>`}</div>`).join('')||'<p class="empty">Aucune demande.</p>';
if(t=='s')b=D.ses.map(s=>`<div class="item">${sesLine(s)}<small>${esc(U(s.rid).nom)} · Parent : ${esc(U(s.pid).nom)} · Fiche : ${s.fiche?'remplie':'manquante'}</small><div>Paiement : ${st(s.pay)} ${s.pay=='Paiement déclaré'?`<button class="btn sm amber" data-act="payok" data-id="${s.id}">Preuve vérifiée</button>`:''}</div></div>`).join('')||'<p class="empty">Aucune séance.</p>';
if(t=='g')b=D.rep.filter(x=>x.kind=='signal').map(x=>`<div class="item"><b>Signalement</b> ${st(x.st)}<p>${esc(x.txt)}</p><small>Par ${esc(U(x.by).nom)} · séance ${x.sid}</small>${x.st=='Ouvert'?`<button class="btn sm amber" data-act="solve" data-id="${x.id}">Marquer traité</button>`:''}</div>`).join('')||'<p class="empty">Aucun signalement.</p>';
if(t=='x')b=`<form data-f="cfg" class="card"><div class="two"><label>Prix d’une séance individuelle (GNF)<input name="prix" type="number" value="${D.cfg.prix}" required></label><label>Séances par mois<input name="sc" type="number" value="${D.cfg.sc}" required></label></div><div class="two"><label>Tarif groupe par élève et par séance (GNF)<input name="grp" type="number" value="${D.cfg.grp}" required></label><label>Quartier pilote<input name="zone" value="${esc(D.cfg.zone)}"></label></div><div class="two"><label>Numéro WhatsApp (avec 224)<input name="wa" value="${esc(D.cfg.wa)}" required></label><label>Email de contact<input name="mail" type="email" value="${esc(D.cfg.mail)}" required></label></div><button class="btn amber">Enregistrer</button></form><form data-f="adm" class="card" style="margin-top:14px"><h3>Ajouter un administrateur</h3><div class="two"><label>Nom<input name="nom" required></label><label>Email<input name="email" type="email" required></label></div><label>Mot de passe provisoire<input name="pw" minlength="6" required></label><button class="btn sm amber">Ajouter</button></form><div class="note">Prototype : en production, les rôles et les données seront protégés côté serveur.</div>`;
if(t=='m')b=msgs(me());return T('admin',L)+b}

function render(){const raw=(location.hash||'#entree').slice(1),a=me(),pub=['accueil','fonctionnement','tarifs','faq'],leg=['conditions','confidentialite'],isAuth=/^((parent|rep)-(connexion|inscription)|admin-connexion)$/.test(raw);let r=raw;
if(r=='observer'){obs=true;try{sessionStorage.setItem('obs','1')}catch(e){}r='accueil'}
if(a){if(!['espace','demande',...leg].includes(r))r='espace'}else if(!(isAuth||leg.includes(r)||r=='entree'||(obs&&pub.includes(r))))r=obs?'accueil':'entree';
if(r!=raw){try{history.replaceState(null,'','#'+r)}catch(e){}}
$('#pub').hidden=!(obs&&!a);
$('#navr').innerHTML=a?`<a class="btn amber sm" data-go="espace">Mon espace</a>`:`<a class="btn amber sm" data-go="entree">Se connecter</a>`;
$('#ft').innerHTML=`Tutora + · Pilote à ${esc(D.cfg.zone)} · <a target="_blank" rel="noopener" href="${wa('Bonjour Tutora +')}">WhatsApp ${pn()}</a> · <a href="mailto:${esc(D.cfg.mail)}">${esc(D.cfg.mail)}</a> · <a data-go="conditions">Conditions</a> · <a data-go="confidentialite">Confidentialité</a>`;
const [p,m]=r.split('-'),v={espace:space,demande:reqForm,entree:entree,conditions:()=>legal(0),confidentialite:()=>legal(1)}[r]||(isAuth?()=>auth(p,m):null);
$('#app').innerHTML=v?v():home();
if(['fonctionnement','tarifs','faq'].includes(r))setTimeout(()=>document.getElementById(r)?.scrollIntoView(),30);else scrollTo(0,0)}
const go=r=>{if(location.hash=='#'+r)render();else location.hash=r};
addEventListener('hashchange',render);
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){e.preventDefault();return go(g.dataset.go)}
const a=e.target.closest('[data-act]');if(!a)return;const id=+a.dataset.id,A=a.dataset.act,R=D.req.find(r=>r.id==id),S=D.ses.find(s=>s.id==id);
if(A=='tab')tab[a.dataset.r]=a.dataset.v;
else if(A=='logout'){D.me=null;D.view=null;obs=false;try{sessionStorage.removeItem('obs')}catch(e){}tab={};save();return go('entree')}
else if(A=='view'){D.view=id;tab={};save();return go('espace')}else if(A=='unview'){D.view=null;tab={}}else if(A=='ct'){tab.mc=id}else if(A=='inst'){if(ip)ip.prompt();return}
else if(A=='acc'){R.st='Acceptée';toast('Demande acceptée')}
else if(A=='ref'){D.ses=D.ses.filter(s=>s.qid!=id);R.st='Refusée par le répétiteur';R.rid=null;toast('Demande refusée')}
else if(A=='val'){U(id).st='valide';toast('Profil validé')}else if(A=='rej'){U(id).st='refuse';toast('Profil refusé')}
else if(A=='paydecl'){const q=cur();D.ses.filter(s=>s.pid==q.id&&s.conf&&s.pay=='Non payé').forEach(s=>s.pay='Paiement déclaré');toast('Paiement déclaré, en attente de vérification')}else if(A=='conf'){S.conf=true;toast('Séance validée')}
else if(A=='payok'){S.pay='Paiement vérifié par l’équipe'}
else if(A=='solve'){D.rep.find(x=>x.id==id).st='Traité'}
save();render()});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-f]');if(!f)return;e.preventDefault();const fd=new FormData(f),o=Object.fromEntries(fd),id=+f.dataset.id,K=f.dataset.f,u=cur();
['mat','niv'].forEach(k=>o[k]=fd.getAll(k));
if(K=='signup'){if(D.u.some(x=>x.email.toLowerCase()==o.email.toLowerCase()))return toast('Cet email a déjà un compte');
if(o.role=='rep'&&(!o.mat.length||!o.niv.length))return toast('Choisissez au moins une matière et un niveau');
const n={id:nid(),role:o.role,nom:o.nom,tel:o.tel,quartier:o.quartier,email:o.email,pw:o.pw};
if(o.role=='rep')Object.assign(n,{mat:o.mat,niv:o.niv,dispo:o.dispo,st:'attente',docs:{carte:o.fcarte.name||'fourni',ecole:o.ecole,filiere:o.filiere,num:o.num}});
D.u.push(n);D.me=n.id;obs=false;save();toast(o.role=='rep'?'Inscription reçue : vous êtes en attente':'Compte créé');return go(o.role=='parent'?'demande':'espace')}
if(K=='login'){const x=D.u.find(x=>x.email.toLowerCase()==o.email.toLowerCase()&&x.pw==o.pw&&x.role==o.role);if(!x)return toast('Email, mot de passe ou profil incorrect');D.me=x.id;obs=false;save();return go('espace')}
if(K=='req'){if(!o.mat.length)return toast('Choisissez au moins une matière');D.req.push({id:nid(),pid:u.id,enfant:o.enfant,niveau:o.niveau,mat:o.mat,type:o.type,quartier:o.quartier,budget:o.budget,dispo:o.dispo,exam:!!o.exam,st:'Nouvelle'});tab.parent='d';toast('Demande envoyée. L’équipe vous répondra.');save();return go('espace')}
if(K=='assign'){const R=D.req.find(r=>r.id==id);R.rid=+o.rid;R.st='Affectée';D.ses.push({id:nid(),qid:id,pid:R.pid,rid:+o.rid,date:o.date,heure:o.heure,st:'Prévue',pay:'Non payé'});toast('Répétiteur affecté')}
if(K=='fiche'){const S=D.ses.find(s=>s.id==id);S.fiche={notions:o.notions,niveau:o.niveau,devoirs:o.devoirs,obs:o.obs};S.st='Réalisée';toast('Fiche enregistrée')}
if(K=='avis'){D.rep.push({id:nid(),sid:id,kind:'avis',note:+o.note,txt:o.txt,by:u.id});toast('Merci pour votre avis')}
if(K=='signal'){D.rep.push({id:nid(),sid:id,kind:'signal',txt:o.txt,by:u.id,st:'Ouvert'});toast('Signalement envoyé à l’équipe')}
if(K=='cfg'){D.cfg={...D.cfg,prix:+o.prix,sc:+o.sc,grp:+o.grp,zone:o.zone,wa:o.wa.replace(/\D/g,''),mail:o.mail};toast('Paramètres enregistrés')}
if(K=='adm'){if(D.u.some(x=>x.email.toLowerCase()==o.email.toLowerCase()))return toast('Cet email existe déjà');D.u.push({id:nid(),role:'admin',nom:o.nom,email:o.email,pw:o.pw,tel:'',quartier:''});toast('Administrateur ajouté')}
if(K=='rdv'){const x=U(id);x.rdv={date:o.date,heure:o.heure,lieu:o.lieu};x.st='rdv';D.msg.push({id:nid(),from:me().id,to:id,txt:`Rendez-vous fixé le ${o.date} à ${o.heure}, lieu : ${o.lieu}.`,t:now()});toast('Rendez-vous fixé')}
if(K=='msg'){const a=me(),to=(a.role=='admin'?+o.to:+f.dataset.to)||0;D.msg.push({id:nid(),from:a.id,to,txt:o.txt,t:now()});toast('Message envoyé')}
save();render()});
render();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
