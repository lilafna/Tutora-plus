<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tutora + | Réussir, près de chez vous</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#3D4BE0"><meta name="color-scheme" content="light"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Palette « trousse d'écolier » : encre bleue, surligneur jaune, stylo rouge, vert de validation */
  --ink:#18224F;--blue:#3D4BE0;--blue-deep:#2A35B8;--blue-soft:#E8EAFF;
  --sun:#FFC93C;--sun-soft:#FFF3CC;--coral:#FF6B5B;--coral-soft:#FFE7E3;--mint:#12A175;--mint-soft:#DCF5EC;
  --paper:#F7F8FF;--card:#FFFFFF;--soft:#59628A;--line:#DEE1F3;--wash:#EFF1FF;
  --warn:#7A5300;--danger:#C8332A;
  --shadow:0 1px 2px rgba(24,34,79,.06),0 10px 24px -14px rgba(24,34,79,.22);
  --shadow-lg:0 2px 4px rgba(24,34,79,.05),0 30px 60px -24px rgba(61,75,224,.42);
  --r:18px;--r-sm:12px;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;--body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;--hand:'Caveat','Segoe Print','Comic Sans MS',cursive;
  --trousse:linear-gradient(90deg,var(--blue) 0 25%,var(--sun) 25% 50%,var(--coral) 50% 75%,var(--mint) 75%);
  color-scheme:light}
html{scroll-padding-top:calc(76px + env(safe-area-inset-top,0px));scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}*{margin:0}
body{font-family:var(--body);background:var(--paper);color:var(--ink);line-height:1.6;font-size:1.0625rem;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3{font-family:var(--display);color:var(--ink);letter-spacing:-.02em;line-height:1.06}
h1{font-size:clamp(2.5rem,7.2vw,4.4rem);font-weight:800}h2{font-size:clamp(1.7rem,4.2vw,2.5rem);font-weight:750}h3{font-size:1.14rem;font-weight:700;letter-spacing:-.01em}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:8px}
[hidden]{display:none!important}
.inst-s{display:none}@media(max-width:560px){#inst .inst-l{display:none}#inst .inst-s{display:inline}}@media(max-width:430px){#inst{padding:6px 11px;min-width:40px}#inst .inst-s{display:none}}
.instd{margin:auto;inset:0;max-height:calc(100% - 32px);overflow:auto;max-width:440px;width:calc(100% - 32px);border:2px solid var(--ink);border-radius:20px;padding:22px 22px 18px;color:var(--ink);background:#fff;box-shadow:0 6px 0 var(--ink)}.instd::backdrop{background:rgba(24,34,79,.45)}.instd h3{margin:0 0 6px}.instd ol{padding-left:22px;margin:10px 0 6px;line-height:1.5}.instd li{margin:7px 0}.instd .instn{color:var(--soft);font-size:.92rem;margin:8px 0 14px}.instd .instn:empty{display:none}.instd .acts{display:flex;justify-content:flex-end}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}.sec{padding:clamp(52px,8vw,96px) 0}.wash{background:var(--wash)}
.sub,.lead{color:var(--soft);margin-top:12px;max-width:58ch}

/* ---------- Boutons ( .amber = bouton principal, nom gardé car utilisé partout ) ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 24px;border-radius:999px;border:2px solid transparent;font:700 1rem var(--body);text-decoration:none;cursor:pointer;color:var(--ink);background:none;transition:transform .15s,box-shadow .15s,background-color .15s,border-color .15s,color .15s}
.btn:active{transform:translateY(2px)}
.amber{background:var(--blue);color:#fff;box-shadow:0 4px 0 var(--blue-deep)}.amber:hover{background:#4A58EC;transform:translateY(-1px);box-shadow:0 5px 0 var(--blue-deep)}.amber:active{transform:translateY(3px);box-shadow:0 1px 0 var(--blue-deep)}
.light{border-color:var(--ink);color:var(--ink);background:#fff;box-shadow:0 4px 0 var(--ink)}.light:hover{background:var(--sun-soft);transform:translateY(-1px)}.light:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.line{border-color:var(--line);background:#fff}.line:hover{border-color:var(--blue);color:var(--blue)}
.sm{min-height:40px;padding:6px 16px;font-size:.92rem}.sm.amber,.sm.light{box-shadow:0 3px 0 var(--blue-deep)}.sm.light{box-shadow:0 3px 0 var(--ink)}
.red{color:var(--danger);border-color:#F6C2BC;background:#fff}.red:hover{background:var(--coral-soft);border-color:var(--coral)}
.btn:disabled{opacity:.6;cursor:progress;transform:none}

/* ---------- En-tête ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px)}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--trousse)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:66px}
.brand{display:inline-flex;align-items:center;gap:10px;font:800 1.5rem var(--display);letter-spacing:-.03em;text-decoration:none;color:var(--ink);cursor:pointer}
.brand b{color:var(--coral);display:inline-block;transition:transform .4s cubic-bezier(.3,1.6,.5,1)}.brand:hover b{transform:rotate(180deg) scale(1.2)}
.brand svg{transition:transform .3s}.brand:hover svg{transform:rotate(-8deg)}
.top nav{display:flex;align-items:center;gap:22px;font-weight:600;font-size:.95rem}.top nav a:not(.btn){color:var(--soft);text-decoration:none;cursor:pointer}.top nav a:not(.btn):hover{color:var(--blue)}
@media(max-width:760px){.top nav a:not(.btn){display:none}}

/* ---------- Haut de page : cahier Seyès, gribouillis qui flottent ---------- */
.hero{position:relative;overflow:hidden;padding:clamp(48px,8vw,100px) 0 clamp(56px,8vw,104px);
  background:
    linear-gradient(90deg,transparent 0 calc(max(20px,(100% - 1100px)/2) - 16px),rgba(255,107,91,.55) calc(max(20px,(100% - 1100px)/2) - 16px) calc(max(20px,(100% - 1100px)/2) - 14px),transparent 0),
    repeating-linear-gradient(0deg,rgba(61,75,224,.17) 0 1px,transparent 1px 32px),
    repeating-linear-gradient(0deg,rgba(61,75,224,.06) 0 1px,transparent 1px 8px),
    #fff}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,0) 60%,var(--paper) 100%);pointer-events:none}
.hero .wrap{position:relative;z-index:1;display:grid;gap:48px;align-items:center;grid-template-columns:1fr}
@media(min-width:880px){.hero .wrap{grid-template-columns:1.1fr .9fr}}
.hero h1{max-width:12ch}
.hl{background:linear-gradient(transparent 56%,var(--sun) 56% 92%,transparent 92%) no-repeat 0 0/100% 100%;-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 .08em}
.hero .sub{font-size:1.18rem}
.hero .pilot{display:inline-flex;align-items:center;gap:10px;margin-top:24px;font-size:.95rem;color:var(--soft);font-weight:600}
.hero .pilot::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 0 rgba(18,161,117,.5)}
.doodles{position:absolute;inset:0;pointer-events:none;z-index:0}
.doodles span{position:absolute;left:var(--x);top:var(--y);font:700 var(--s,2.4rem)/1 var(--hand);color:var(--c);opacity:.5;transform:rotate(var(--r))}
@media(max-width:879px){.doodles span{opacity:.28}.doodles span:nth-child(n+6){display:none}}

/* Fiche de séance animée */
.scene{position:relative;justify-self:center;width:100%;max-width:430px;padding-top:34px}
.fiche{position:relative;background:#fff;border:2px solid var(--ink);border-radius:var(--r);box-shadow:8px 8px 0 var(--blue);padding:22px 22px 18px;transform:rotate(-1.5deg)}
.fiche header{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding-bottom:12px;border-bottom:2px dashed var(--line)}
.fiche header b{font:700 1.08rem var(--display)}.fiche header span{font-size:.85rem;color:var(--soft)}
.fiche dl{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;margin:14px 0 4px;font-size:.96rem}
.fiche dt{color:var(--soft)}.fiche dd{margin:0;font-weight:600}
.fiche .lvl{display:flex;gap:5px;align-items:center}.fiche .lvl i{width:24px;height:9px;border-radius:5px;background:var(--blue-soft);overflow:hidden;position:relative}
.fiche .lvl i.on::before{content:"";position:absolute;inset:0;background:var(--mint);transform-origin:left}
.fiche footer{background:none;margin-top:14px;padding:12px 0 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.88rem;color:var(--soft)}
.stamp{position:absolute;right:-14px;top:52%;font:700 1.9rem/1 var(--hand);color:var(--coral);border:3px solid var(--coral);border-radius:50%;width:92px;height:92px;display:grid;place-items:center;transform:rotate(-14deg);background:rgba(255,255,255,.85)}
@media(max-width:560px){.scene{padding-right:10px}.stamp{width:72px;height:72px;font-size:1.5rem;right:-6px;top:auto;bottom:58px}.fiche dl{font-size:.92rem}}
.bulle{position:absolute;top:0;left:-6px;z-index:2;display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;font-weight:600;font-size:.9rem;padding:9px 16px;border-radius:16px 16px 16px 4px;box-shadow:var(--shadow-lg);max-width:calc(100% - 20px);white-space:nowrap}
.annot{display:flex;align-items:center;gap:6px;margin:16px 0 0 18px;font:700 1.45rem/1.1 var(--hand);color:var(--coral)}
.annot svg{flex:none;width:52px;height:38px}

/* Bandeau des matières qui défile */
.ticker{overflow:hidden;background:var(--ink);color:#fff;padding:14px 0;transform:rotate(-1deg);margin:-14px -10px 0;position:relative;z-index:2}
.ticker .track{display:flex;width:max-content}
.ticker .grp{display:flex;align-items:center;gap:28px;padding-right:28px;font:700 1.15rem var(--display);white-space:nowrap}
.ticker .grp i{color:var(--sun);font-style:normal}

/* Étapes : des post-it */
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin-top:32px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow)}
.card h3{margin-bottom:6px}.card p{color:var(--soft)}
.postits .card{border:none;border-radius:4px 4px 18px 4px;box-shadow:0 14px 22px -16px rgba(24,34,79,.45);transition:transform .25s}
.postits .card:nth-child(1){background:var(--sun-soft);--rot:-1.6deg}.postits .card:nth-child(2){background:var(--blue-soft);--rot:1.2deg}
.postits .card:nth-child(3){background:var(--mint-soft);--rot:-.8deg}.postits .card:nth-child(4){background:var(--coral-soft);--rot:1.6deg}
.postits .card{transform:rotate(var(--rot,0))}.postits .card:hover{transform:rotate(0) translateY(-4px)}
.postits .card p{color:#3F486E}
.n{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--ink);color:#fff;font:800 1.05rem var(--display);margin-bottom:14px}
.niv .card h3{display:flex;align-items:center;gap:10px}.niv .card h3 span{font-size:1.4rem}
.tag{display:inline-block;padding:3px 11px;border-radius:999px;background:var(--wash);border:1px solid var(--line);font-size:.84rem;font-weight:600;margin:2px 4px 2px 0;color:var(--ink)}
.ok{background:var(--mint-soft);color:#0B7655;border-color:transparent}.warn{background:var(--sun-soft);color:var(--warn);border-color:transparent}.bad{background:var(--coral-soft);color:var(--danger);border-color:transparent}
.adm{background:var(--ink);color:#fff;border-color:transparent}
.price{font:800 2.3rem var(--display);color:var(--blue);letter-spacing:-.03em}
.ticket{border:2px solid var(--ink);box-shadow:6px 6px 0 var(--sun)}.ticket+.ticket{box-shadow:6px 6px 0 var(--coral)}
.verif{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.badge-ok{flex:none;width:76px;height:76px;border-radius:50%;background:var(--mint);display:grid;place-items:center;color:#fff}
.note{border-left:5px solid var(--blue);background:var(--blue-soft);padding:12px 16px;border-radius:var(--r-sm);font-size:.95rem;margin-top:18px}

/* Formulaires */
form{display:grid;gap:14px}label{display:grid;gap:6px;font-weight:600;font-size:.95rem}
input,select,textarea{font:inherit;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:var(--r-sm);padding:10px 14px;min-height:48px;width:100%;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px rgba(61,75,224,.15)}
input[type=checkbox],input[type=radio]{width:20px;height:20px;min-height:0;accent-color:var(--blue)}
input[type=file]{padding:9px 12px}
.pw{position:relative;display:block}.pw input{padding-right:96px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border:none;border-radius:999px;background:var(--wash);color:var(--blue);font:700 .85rem var(--body);cursor:pointer;transition:background-color .15s}
.eye:hover{background:var(--blue-soft)}.eye svg{width:20px;height:20px}
.eye .lid{transform-origin:12px 12px;transition:transform .25s}.eye .slash{stroke-dasharray:24;stroke-dashoffset:0;transition:stroke-dashoffset .25s}
.eye.on .slash{stroke-dashoffset:24}.eye.on{background:var(--sun-soft);color:var(--ink)}
.chk{display:flex;flex-wrap:wrap;gap:8px 18px}label.chk{flex-wrap:nowrap}label.chk>span{flex:1;min-width:0}label.chk>input{flex:none;margin-top:3px}.chk label{display:flex;align-items:center;gap:8px;font-weight:500}
.two{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
summary{cursor:pointer;color:var(--blue);font-weight:600}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:5px;margin:20px 0;background:#fff;border:2px solid var(--line);border-radius:999px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs .btn{white-space:nowrap;border-color:transparent;background:transparent;min-height:38px;color:var(--soft);box-shadow:none}
.tabs .btn:hover{color:var(--blue)}
.tabs .on,.tabs .on:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.item{border:1px solid var(--line);border-radius:16px;padding:16px 18px;background:var(--card);margin-bottom:12px;line-height:1.55}
.item>:is(div,small,form,details,p,fieldset,img){display:block;margin-top:8px}.item>:first-child{margin-top:0}
.item>.acts{display:flex}.item>form{display:grid}.item small{color:var(--soft)}.item b{color:var(--ink)}.acts{display:flex;flex-wrap:wrap;gap:8px}
.faq details{border-bottom:2px dashed var(--line);padding:18px 0}.faq summary{font-weight:700;color:var(--ink);list-style:none;display:flex;justify-content:space-between;gap:16px;align-items:center}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--sun);color:var(--ink);font:700 1.3rem/1 var(--display);transition:transform .25s,background-color .25s}
.faq details[open] summary::after{transform:rotate(45deg);background:var(--coral);color:#fff}
.faq p{color:var(--soft);margin-top:8px;max-width:64ch}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;font-weight:600;z-index:50;box-shadow:var(--shadow-lg);max-width:calc(100% - 32px);border-bottom:4px solid var(--sun)}
body>footer{position:relative;background:var(--ink);color:rgba(255,255,255,.78);padding:36px 0 32px;font-size:.92rem}body>footer::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:var(--trousse)}body>footer a{color:#fff;cursor:pointer}
.empty{color:var(--soft);padding:14px 0}.mob{display:none}@media(max-width:760px){.mob{display:block}}.narrow{max-width:580px;margin:0 auto}
fieldset{border-color:var(--line)!important}

/* Page d'entrée : choix du profil */
.roles .card{display:block;text-decoration:none;color:inherit;cursor:pointer;border:2px solid var(--line);transition:transform .2s,border-color .2s,box-shadow .2s}
.roles .card:hover{transform:translateY(-4px);border-color:var(--ink);box-shadow:6px 6px 0 var(--ink)}
.roles .ico{display:grid;place-items:center;width:58px;height:58px;border-radius:18px;font-size:1.9rem;margin-bottom:14px}
.roles .card:nth-child(1) .ico{background:var(--sun-soft)}.roles .card:nth-child(2) .ico{background:var(--blue-soft)}.roles .card:nth-child(3) .ico{background:var(--mint-soft)}
.hello{display:inline-block;transform-origin:70% 80%}

/* ---------- Mouvements (désactivés si l'utilisateur a demandé moins d'animations) ---------- */
@media(prefers-reduced-motion:no-preference){
  .hl{animation:surligne 1s cubic-bezier(.6,.1,.3,1) .35s both}
  @keyframes surligne{from{background-size:0 100%}}
  .doodles span{animation:flotte var(--d,8s) ease-in-out infinite alternate}
  @keyframes flotte{to{transform:translateY(-18px) rotate(calc(var(--r) + 10deg))}}
  .hero .pilot::before{animation:ping 2s ease-out infinite}
  @keyframes ping{to{box-shadow:0 0 0 12px rgba(18,161,117,0)}}
  .fiche{animation:poser .8s cubic-bezier(.2,.8,.2,1) .15s both}
  @keyframes poser{from{opacity:0;transform:translateY(24px) rotate(-5deg)}}
  .fiche .lvl i.on::before{animation:remplir .5s ease-out both}
  .fiche .lvl i:nth-child(1)::before{animation-delay:.9s}.fiche .lvl i:nth-child(2)::before{animation-delay:1.05s}.fiche .lvl i:nth-child(3)::before{animation-delay:1.2s}
  @keyframes remplir{from{transform:scaleX(0)}}
  .stamp{animation:tampon .45s cubic-bezier(.3,1.5,.5,1) 1.6s both}
  @keyframes tampon{from{opacity:0;transform:rotate(-14deg) scale(2.2)}}
  .bulle{animation:pop .5s cubic-bezier(.3,1.5,.5,1) 1s both}.bulle.pop{animation:pop .5s cubic-bezier(.3,1.5,.5,1) both}
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.85)}}
  .annot path{stroke-dasharray:120;animation:trace 1s ease-out 2s both}
  @keyframes trace{from{stroke-dashoffset:120}}
  .annot span{animation:apparait .6s ease-out 2.4s both}@keyframes apparait{from{opacity:0}}
  .ticker .track{animation:defile 28s linear infinite}.ticker:hover .track{animation-play-state:paused}
  @keyframes defile{to{transform:translateX(-50%)}}
  [data-rev]{opacity:0;translate:0 26px;transition:opacity .6s ease,translate .6s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--i,0) * 110ms)}
  [data-rev].vu{opacity:1;translate:0 0}
  .roles .card:hover .ico{animation:hop .5s ease}
  @keyframes hop{40%{transform:translateY(-8px) rotate(-8deg)}70%{transform:translateY(0) rotate(4deg)}}
  .hello{animation:salut 1.6s ease-in-out .3s 1}
  @keyframes salut{10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-10deg)}50%{transform:none}}
  .toast:not([hidden]){animation:monte .35s cubic-bezier(.3,1.4,.5,1)}
  @keyframes monte{from{opacity:0;transform:translate(-50%,20px)}}
  .badge-ok{animation:pulse 2.4s ease-out infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(18,161,117,.45)}100%{box-shadow:0 0 0 18px rgba(18,161,117,0)}}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style></head><body>
<header class="top"><div class="wrap bar">
<a class="brand" data-go="accueil"><svg width="36" height="36" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#3D4BE0"/><circle cx="32" cy="8.5" r="3.6" fill="#FF6B5B"/><path d="M8 19.5 20 9l12 10.5M12 18v12.5h16V18" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 20.5v7M16.5 24h7" stroke="#FFC93C" stroke-width="2.8" stroke-linecap="round"/></svg>Tutora<b>+</b></a>
<nav><span id="pub" style="display:contents" hidden><a data-go="fonctionnement">Fonctionnement</a><a data-go="tarifs">Tarifs</a><a data-go="faq">Questions</a></span><button class="btn light sm" id="inst" hidden data-act="inst" aria-haspopup="dialog" aria-label="Installer l’appli" title="Installer l’appli"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span class="inst-l">Installer l’appli</span><span class="inst-s">Installer</span></button><span id="navr"></span></nav></div></header>

$('#app').innerHTML=`<section class="sec"><div class="wrap narrow">${D.me?'<a data-go="espace" style="cursor:pointer;color:var(--soft)">← Retour à l’espace parent</a>':''}<h2 style="margin-top:8px">Salut ${esc(c.prenom)} !</h2><p class="lead">Tes devoirs, tes progrès et tes questions au répétiteur.</p>

${tk.some(t=>t.fait)?`<details style="margin-top:16px"><summary><b>Devoirs terminés</b></summary>${tk.filter(t=>t.fait).map(task).join('')}</details>`:''}

${cours.length?`<form data-f="cmsg" style="margin-top:12px">${cours.length>1?`<label>À qui ?<select name="q">${cours.map(x=>`<option value="${x.q}">${esc(x.rep)} (${esc((x.mat||[]).join(', '))})</option>`).join('')}</select></label>`:`<input type="hidden" name="q" value="${cours[0].q}">`}<label>Ta question<textarea name="txt" required maxlength="1000"></textarea></label><button class="btn amber">Envoyer</button></form>`:'<p class="empty">Tu pourras écrire à ton répétiteur dès que ton cours aura commencé.</p>'}</div></section>`}

function msgs(u){const ro=!!viewing(),fmt=m=>`<div class="item" style="max-width:88%;${m.from==u.id?'margin-left:auto;background:var(--wash)':''}"><small>${esc(m.t)} · ${m.from==u.id?'Vous':m.from?esc(who(m.from)):'Élève'}</small>${esc(m.txt)}</div>`;

const par=u.role=='parent',acc=D.req.filter(r=>r.st=='Acceptée'),
ps=par?[...new Set(D.req.filter(r=>r.rid).map(r=>r.rid))]:[...new Set(D.req.filter(r=>r.rid==u.id).flatMap(r=>[r.pid,...D.enr.filter(e=>e.qid==r.id).map(e=>e.pid)]))],
kd=[...new Map(D.enr.filter(e=>acc.some(r=>r.id==e.qid&&(par?e.pid==u.id:r.rid==u.id))).map(e=>[e.child_id,{id:e.child_id,n:e.prenom}])).values()],

 (list.map(x=>`<div class="item"><b>${esc(x.nom)}</b> ${x.note?`<span class="tag ok">★ ${x.note} (${x.nb_avis} avis)</span>`:'<span class="tag">Nouveau</span>'}<div>${tags(x.mat)}${tags(x.niv)}</div><small>${esc(x.quartier)} · ${esc(x.dispo)}</small><div class="acts"><button class="btn sm amber" data-act="pick" data-id="${x.id}">Choisir ce répétiteur</button></div></div>`).join('')||'<p class="empty">Aucun répétiteur ne correspond. Élargissez la recherche ou laissez l’équipe choisir.</p>')}
if(t=='c'){b=`<div class="acts" style="margin-bottom:14px"><button class="btn amber" data-act="tab" data-r="parent" data-v="r">+ Nouveau cours</button></div>`+
 mineQ.map(r=>{const own=r.pid==u.id,planned=[...new Set(D.ses.filter(s=>s.qid==r.id&&s.st!='Annulée').map(s=>s.mois).filter(Boolean))],free=months().filter(m=>!planned.includes(m)),

  return `<div class="item"><b>${esc(kidNames(r.id))} · ${esc(qLabel(r))}</b> ${st(r.st=='Envoyée'?'En attente du répétiteur':r.st=='Nouvelle'?'L’équipe choisit le répétiteur':r.st)}${r.type=='Groupe'?` <span class="tag">${D.gsize[r.id]||'?'} élève(s)</span>`:''}

 (mineQ.length?'':'<p class="empty">Aucun cours pour l’instant. Choisissez un répétiteur pour commencer.</p>')}

addEventListener('hashchange',render);

async function loadCfg(){try{const {data}=await SB.from('settings').select('*').eq('k','cfg');if(data&&data[0])D.cfg={...DEF,...data[0].v}}catch(e){}}
async function load(){if(!D.me)return;const g=t=>SB.from(t).select('*'),r=await Promise.all([g('profiles'),g('requests').order('id',{ascending:false}),g('enrollments'),g('sessions'),g('notes'),g('changes').order('id'),g('tasks').order('id',{ascending:false}),g('task_done'),g('messages').order('id'),g('reports'),g('payments').order('created_at',{ascending:false}),g('children'),SB.rpc('tutors')]);
[D.u,D.req,D.enr,D.ses,D.notes,D.chg,D.tasks,D.done,,D.rep,D.pays,D.children,D.tutors]=r.map(x=>x.data||[]);
D.msg=(r[8].data||[]).map(m=>({id:m.id,from:m.from_id,to:m.to_id||0,ch:m.child_id,txt:m.txt,t:new Date(m.created_at).toLocaleString('fr-FR')}));
D.gsize={};await Promise.all(D.req.filter(q=>q.type=='Groupe').map(async q=>{const {data}=await SB.rpc('group_size',{q:q.id});D.gsize[q.id]=data}));
await loadCfg()}
const clear=()=>{Object.assign(D,{me:null,view:null,u:[],req:[],enr:[],ses:[],notes:[],chg:[],tasks:[],done:[],msg:[],rep:[],pays:[],children:[],tutors:[]});tab={}};
async function boot(){try{if(!SB)throw 0;await loadCfg();const {data}=await SB.auth.getSession();if(data.session){D.me=data.session.user.id;await load();if(!me()){await SB.auth.signOut();clear()}}}catch(e){toast('Connexion au serveur impossible')}render()}
setInterval(()=>{if(D.me&&!document.hidden&&location.hash=='#espace'&&!document.activeElement?.closest('form,input,textarea,select,details[open]'))load().then(render).catch(()=>{})},30000);

// Formulaire de demande : afficher le choix de groupe seulement pour un groupe
document.addEventListener('change',e=>{const f=e.target.closest('form[data-f="req"]');if(f&&e.target.name=='type')f.querySelector('[data-grp]').hidden=e.target.value!='Groupe';
const c=e.target.closest('form[data-f="chg"]');if(c&&e.target.name=='kind')c.querySelectorAll('input[type=date],input[type=time]').forEach(i=>i.closest('label').hidden=e.target.value=='annulation')});

document.addEventListener('click',async e=>{const g=e.target.closest('[data-go]');if(g){e.preventDefault();return go(g.dataset.go)}
const a=e.target.closest('[data-act]');if(!a)return;const id=a.dataset.id,A=a.dataset.act,q=(t,v)=>SB.from(t).update(v).eq('id',id);
try{
if(A=='inst'){if(ip){ip.prompt();const r=await ip.userChoice.catch(()=>({}));if(r.outcome=='accepted')ip=null}else instHelp();return}
if(A=='instclose'){const d=$('#instd');d.close?d.close():d.removeAttribute('open');return}
if(A=='eye'){const i=a.parentElement.querySelector('input'),v=i.type=='password';i.type=v?'text':'password';a.classList.toggle('on',v);a.setAttribute('aria-pressed',v);a.setAttribute('aria-label',v?'Masquer le mot de passe':'Afficher le mot de passe');a.lastElementChild.textContent=v?'Cacher':'Voir';i.focus();return}
if(A=='tab'){tab[a.dataset.r]=a.dataset.v;if(location.hash!='#espace')return go('espace')}else if(A=='ct')tab.mc=id;else if(A=='view'){D.view=id;tab={}}else if(A=='unview'){D.view=null;tab={}}
else if(A=='pick'){tab.pick=id||null;return go('demande')}else if(A=='backTutors'){tab.parent='r';return go('espace')}
else if(A=='logout'){await SB.auth.signOut();clear();obs=false;try{sessionStorage.removeItem('obs')}catch(e){}return go('entree')}
else if(A=='carte'){const {data}=await SB.storage.from('cartes').createSignedUrl(a.dataset.path,300);if(data)open(data.signedUrl,'_blank');else toast('Carte introuvable');return}
else if(A=='copy'){try{await navigator.clipboard.writeText(a.dataset.link);toast('Lien copié')}catch(e){toast('Copiez le lien manuellement')}return}else if(A=='goKids'){tab.parent='k';return go('espace')}
else if(A=='refresh'){}
else if(A=='acc'){await ok(SB.rpc('answer_request',{q:+id,ok:true}));toast('Cours accepté. Le parent va planifier le mois.')}
else if(A=='ref'){const why=prompt('Motif du refus (le parent le verra) :');if(why===null)return;await ok(SB.rpc('answer_request',{q:+id,ok:false,why}));toast('Demande refusée')}
else if(A=='mok'||A=='mno'){if(A=='mno'&&!confirm('Refuser tout ce planning ? Le parent devra en proposer un autre.'))return;const {data}=await ok(SB.rpc('confirm_month',{q:+id,m:a.dataset.m,ok:A=='mok'}));toast(A=='mok'?`${data} séances confirmées`:'Planning refusé')}
else if(A=='chgok'||A=='chgno'){await ok(SB.rpc('answer_change',{c:+id,ok:A=='chgok'}));toast(A=='chgok'?'Changement accepté':'Changement refusé')}
else if(A=='conf'){await ok(SB.rpc('confirm_note',{n:+id}));toast('Séance confirmée')}
else if(A=='deltask'){if(!confirm('Supprimer ce devoir ?'))return;await ok(SB.from('tasks').delete().eq('id',id));toast('Devoir supprimé')}
else if(A=='admcancel'){if(!confirm('Annuler cette séance en tant qu’équipe Tutora + ?'))return;await ok(q('sessions',{st:'Annulée'}));toast('Séance annulée')}
else if(A=='val'){await ok(q('profiles',{st:'valide'}));toast('Profil validé')}else if(A=='rej'){await ok(q('profiles',{st:'refuse'}));toast('Profil refusé')}
else if(A=='mkadm'){if(confirm('Donner les droits administrateur à ce compte ?')){await ok(q('profiles',{role:'admin'}));toast('Administrateur ajouté')}}
else if(A=='solve'){await ok(q('reports',{st:'Traité'}))}
else if(A=='delacc'){const x=U(id),kind=x.role=='admin'?'administrateur':x.role=='rep'?'répétiteur':'parent';
 const r=prompt(`Supprimer définitivement le compte ${kind} de ${x.nom} ?\n\nSes enfants, ses messages et ses séances à venir seront supprimés. L’historique des séances passées et des paiements est gardé.\n\nCette action est irréversible. Tapez SUPPRIMER pour confirmer :`);
 if(r===null)return;if(r.trim().toUpperCase()!='SUPPRIMER')return toast('Suppression annulée : le mot tapé ne correspond pas');
 await ok(SB.rpc('delete_account',{target:id}));if(x.docs?.carte){try{await SB.storage.from('cartes').remove([x.docs.carte])}catch(e){}}
 if(D.view==id)D.view=null;toast(`Compte de ${x.nom} supprimé`)}
await load();render()}catch(err){if(!err||!err.shown)toast('Erreur réseau, réessayez')}});

document.addEventListener('submit',async e=>{const f=e.target.closest('[data-f]');if(!f)return;e.preventDefault();const b=f.querySelector('button:not([type=button])');if(b){if(b.disabled)return;b.disabled=true}
const fd=new FormData(f),o=Object.fromEntries(fd),id=f.dataset.id,K=f.dataset.f,u=cur();['mat','niv','kids','j'].forEach(k=>o[k]=fd.getAll(k));
try{
if(K=='cmsg'){const {error}=await SB.rpc('child_send',{tok:CT,t:o.txt,q:+o.q||null});if(error)return toast(/répétiteur/.test(error.message)?'Tu n’as pas encore de répétiteur':'Message non envoyé');toast('Message envoyé');return childLoad(CT)}
if(K=='tdone'){const {error}=await SB.rpc('child_task_done',{tok:CT,task:+id,rep:o.rep||''});if(error)return toast('Non enregistré, réessaie');toast('Bravo, devoir terminé !');return childLoad(CT)}
if(K=='flt'){tab.flt={mat:o.mat?.[0]||'',niv:o.niv?.[0]||'',q:o.q};return render()}
if(viewing()&&!['msg','assign','rdv','cfg'].includes(K))return toast('Action réservée au propriétaire du compte');
if(K=='signup'){if(o.role=='rep'&&(!o.mat.length||!o.niv.length))return toast('Choisissez au moins une matière et un niveau');
const meta={role:o.role,nom:o.nom,tel:o.tel,quartier:o.quartier,...(o.role=='rep'?{mat:o.mat,niv:o.niv,dispo:o.dispo,ecole:o.ecole,filiere:o.filiere,num:o.num}:{})};
const {data,error}=await SB.auth.signUp({email:o.email,password:o.pw,options:{data:meta,emailRedirectTo:location.origin+location.pathname+'#'+o.role+'-connexion'}});if(error)return toast(/registered|exists/i.test(error.message)?'Cet email a déjà un compte':'Erreur : '+error.message);
if(!data.session){toast(o.role=='rep'?'Compte créé : confirmez votre email, connectez-vous, puis renvoyez votre carte depuis votre profil':'Compte créé : confirmez votre email puis connectez-vous');return go(o.role+'-connexion')}
const uid=data.user.id,P={id:uid,role:o.role,nom:o.nom,tel:o.tel,email:o.email,quartier:o.quartier,st:'attente'};
if(o.role=='rep'){const fl=o.fcarte,ex=((fl.name||'').split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg',path=`${uid}/carte.${ex}`,up=await SB.storage.from('cartes').upload(path,fl);if(up.error)return toast('Envoi de la carte impossible : '+up.error.message);Object.assign(P,{mat:o.mat,niv:o.niv,dispo:o.dispo,docs:{carte:path,ecole:o.ecole,filiere:o.filiere,num:o.num}})}
await ok(SB.from('profiles').insert(P));D.me=uid;obs=false;await load();toast(o.role=='rep'?'Inscription reçue : vous êtes en attente':'Compte créé');if(o.role=='parent')tab.parent='k';return go('espace')}
if(K=='login'){const {data,error}=await SB.auth.signInWithPassword({email:o.email,password:o.pw});if(error)return toast('Email ou mot de passe incorrect');D.me=data.user.id;await load();
if(!me()){const md=data.user.user_metadata||{};if(md.role==o.role&&['parent','rep'].includes(md.role)){const P={id:D.me,role:md.role,nom:md.nom||o.email,tel:md.tel,email:o.email,quartier:md.quartier,st:'attente'};if(md.role=='rep')Object.assign(P,{mat:md.mat||[],niv:md.niv||[],dispo:md.dispo,docs:{ecole:md.ecole,filiere:md.filiere,num:md.num}});const ins=await SB.from('profiles').insert(P);if(!ins.error){await load();if(md.role=='parent')tab.parent='k'}}}
const m=me();if(!m||m.role!=o.role){await SB.auth.signOut();clear();return toast('Ce compte n’est pas un compte '+PORT[o.role].toLowerCase())}obs=false;return go('espace')}
if(K=='req'){if(!o.kids.length)return toast('Choisissez le ou les enfants');if(!o.mat.length)return toast('Choisissez au moins une matière');
 await ok(SB.rpc('create_request',{rep:o.rep||null,kids:o.kids.map(Number),typ:o.type,mode:o.type=='Groupe'?o.mode:null,mats:o.mat,quart:o.quartier,disp:o.dispo,budg:o.budget||'',ex:!!o.exam}));
 tab.parent='c';tab.pick=null;toast(o.rep?'Demande envoyée au répétiteur':'Demande envoyée : l’équipe choisit le répétiteur');await load();return go('espace')}
if(K=='join'){await ok(SB.rpc('join_group',{c:o.code,kid:+o.kid}));tab.parent='c';toast('Votre enfant a rejoint le groupe')}
if(K=='plan'){if(!o.j.length)return toast('Cochez au moins un jour');const {data}=await ok(SB.rpc('plan_month',{q:+id,m:o.m,jours:o.j.map(Number),h:o.h}));toast(`${data} séances créées. Le répétiteur va confirmer le mois.`);tab.parent='p'}
if(K=='chg'){if(o.kind=='report'&&(!o.d||!o.h))return toast('Choisissez la nouvelle date et l’heure');if(o.kind=='report'&&isPast(o.d,o.h))return toast('Choisissez une date à venir');
 await ok(SB.rpc('ask_change',{s:+id,k:o.kind,d:o.kind=='report'?o.d:null,h:o.kind=='report'?o.h:null,why:o.why}));toast('Demande envoyée, en attente de l’accord de l’autre partie')}
if(K=='kid'){await ok(SB.from('children').insert({pid:u.id,prenom:o.prenom,niveau:o.niveau,a_telephone:!!o.tel}));toast('Enfant ajouté')}
if(K=='carte'){const fl=o.fcarte,ex=((fl.name||'').split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg',path=`${u.id}/carte.${ex}`,up=await SB.storage.from('cartes').upload(path,fl,{upsert:true});if(up.error)return toast('Envoi impossible : '+up.error.message);await ok(SB.rpc('set_carte',{path}));toast('Carte envoyée')}
if(K=='assign'){await ok(SB.from('requests').update({rid:o.rid,st:'Envoyée',motif:null}).eq('id',id));toast('Proposé au répétiteur')}
if(K=='fiche'){const ks=kidsOf(Q(D.ses.find(s=>s.id==id)?.qid).id),fiches={};for(const e of ks){const c=e.child_id,pr=!!fd.get('p_'+c);if(pr&&(!o['n_'+c]||!o['v_'+c]))return toast(`Remplissez les points étudiés et le niveau de ${e.prenom}`);fiches[c]={present:pr,notions:o['n_'+c],niveau:o['v_'+c],devoirs:o['d_'+c],obs:o['o_'+c]}}
 await ok(SB.rpc('save_fiche',{s:+id,fiches}));toast('Fiche enregistrée')}
if(K=='task'){const [qq,cc]=o.to.split(':');if(o.ech&&o.ech<today())return toast('La date doit être aujourd’hui ou plus tard');let path=null,nom=null;const fl=o.f;
 if(fl&&fl.size){if(fl.size>10*1024*1024)return toast('Fichier trop lourd (10 Mo maximum)');const ex=((fl.name||'').split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'')||'bin';path=`${u.id}/${rid()}.${ex}`;nom=fl.name;const up=await SB.storage.from('devoirs').upload(path,fl);if(up.error)return toast('Envoi du fichier impossible : '+up.error.message)}
 await ok(SB.from('tasks').insert({qid:+qq,child_id:cc?+cc:null,titre:o.titre,consigne:o.consigne||null,fichier:path,fichier_nom:nom,echeance:o.ech||null}));toast('Devoir envoyé à l’élève')}
if(K=='pay'){const {data,error}=await SB.functions.invoke('soutra-init',{body:{tel:o.tel}});if(error){let m='Paiement indisponible pour le moment';try{m=(await error.context.json()).error||m}catch(x){}return toast(m)}
 if(data?.redirect_url){location.href=data.redirect_url;return}toast(data?.message||'Validez le paiement sur votre téléphone')}
if(K=='avis'){await ok(SB.from('reports').insert({sid:+id,kind:'avis',note:+o.note,txt:o.txt}));toast('Merci pour votre avis')}
if(K=='signal'){await ok(SB.from('reports').insert({sid:+id,kind:'signal',txt:o.txt,st:'Ouvert'}));toast('Signalement envoyé à l’équipe')}
if(K=='cfg'){D.cfg={...D.cfg,prix:+o.prix,sc:+o.sc,grp:+o.grp,zone:o.zone,wa:o.wa.replace(/\D/g,''),mail:o.mail};await ok(SB.from('settings').upsert({k:'cfg',v:D.cfg}));toast('Paramètres enregistrés')}
if(K=='rdv'){if(o.date<today())return toast('Choisissez une date à venir');await ok(SB.from('profiles').update({rdv:{date:o.date,heure:o.heure,lieu:o.lieu},st:'rdv'}).eq('id',id));await ok(SB.from('messages').insert({to_id:id,txt:`Rendez-vous fixé le ${fdate(o.date)} à ${o.heure}, lieu : ${o.lieu}.`}));toast('Rendez-vous fixé')}
if(K=='msg'){const to=me().role=='admin'?o.to:f.dataset.to;await ok(SB.from('messages').insert(to&&to[0]=='k'?{child_id:+to.slice(1),to_id:null,txt:o.txt}:{to_id:to&&to!='0'?to:null,txt:o.txt}));toast('Message envoyé')}
await load();render()}catch(err){if(!err||!err.shown)toast('Erreur réseau, réessayez')}finally{if(b)b.disabled=false}});

// Retour du paiement Soutra Money (?paiement=ok) : on recharge pour voir le statut
if(/[?&]paiement=/.test(location.search)){tab.parent='f';try{history.replaceState(null,'',location.pathname+'#espace')}catch(e){}}
boot();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
